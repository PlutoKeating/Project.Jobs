# 本地依赖服务（应用、worker、控制台、Demo 均在宿主机用 pnpm 原生运行）
# 端口统一放在 5xxxx 段，避免与本机其他服务冲突；可在 .env 中覆盖。
name: pux

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-pux}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pux}
      POSTGRES_DB: ${PG_DB:-pux}
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-pux}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # 官方 minio/minio 镜像已停止在 Docker Hub 发布，这里使用 elestio 重新打包的 MinIO 二进制
    image: elestio/minio:latest
    restart: unless-stopped
    entrypoint: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-puxadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-puxadmin-secret}
    ports:
      - "127.0.0.1:${S3_PORT:-59000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-59001}:9001"
    volumes:
      - s3data:/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-pux-local}
      VERTEX_PROJECT: ${VERTEX_PROJECT:?请在 .env 中设置 VERTEX_PROJECT}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/adc.json
    ports:
      - "127.0.0.1:${LITELLM_PORT:-54000}:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
      - ${GOOGLE_ADC_FILE:?请在 .env 中设置 GOOGLE_ADC_FILE}:/secrets/adc.json:ro

  temporal:
    # Temporal dev server（SQLite 持久化，内置 Web UI）
    image: temporalio/temporal:latest
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--ui-port", "8233"]
    user: "0:0"
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-57233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-58233}:8233"
    volumes:
      - temporaldata:/data

  nats:
    # JobsWorld 事件总线（JetStream 持久化；只监听本机）
    image: nats:2.12-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-54222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-58222}:8222"
    volumes:
      - natsdata:/data

  tshock:
    # JobsWorld 游戏服（TShock 6.x，原版 Terraria 1.4.5.8 客户端）。按需启动：
    #   docker compose --profile game up -d --build --no-deps tshock
    profiles: [game]
    build:
      context: .
      dockerfile: infra/game/tshock/Dockerfile
    image: pux-tshock:latest
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      NATS_URL: nats://nats:4222
      JW_GAME_PASSWORD: ${JW_GAME_PASSWORD:-}
      JW_ADMIN_PASSCODE: ${JW_ADMIN_PASSCODE:-}
      JW_WORLD_NAME: ${JW_WORLD_NAME:-JobsWorld}
      JW_MAX_PLAYERS: ${JW_MAX_PLAYERS:-16}
    ports:
      - "127.0.0.1:${TSHOCK_PORT:-57777}:7777"
    volumes:
      - tshockdata:/data

volumes:
  tshockdata:
  natsdata:
  pgdata:
  s3data:
  temporaldata:
