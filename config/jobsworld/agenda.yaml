# 日程骨架规则：按人物角色给出一天的地点序列；模型只补全意图与因果，不改地点与时间
# place: 地点类型（town.yaml 的 kind）；special: home=自己的家，work=这个人的工作地点（居民表里登记的，或按职业推断），commute=按人推断地铁或开车
# k: 这段时间在做哪一类事（sleep / routine / commute / work / study / meal / errand / care / leisure / phone / rest），
#    决定需求怎么变化（饿、累、孤单、压力）以及手机在不在手边。需求会临时改写日程：饿极了去吃东西，困得不行提前睡，闷了找人聊。
