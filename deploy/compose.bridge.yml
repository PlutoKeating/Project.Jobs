# macOS / Windows（Docker Desktop、OrbStack）：容器不能直接用宿主机网络。
# 发布本机地址（localhost / 127.0.0.1）时自动换成 host.docker.internal，城里的人照样能打开你电脑上的开发服务器。
services:
  jobs:
    ports:
      - "${JOBS_BIND:-0.0.0.0}:${JOBS_PORT:-7777}:7777"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://jobs:${PG_PASSWORD}@postgres:5432/jobs
      S3_ENDPOINT: http://minio:9000
      NATS_URL: nats://nats:4222
      JW_PORT: "7777"
      JW_HOST: 0.0.0.0
      TSHOCK_HOST: tshock
      TSHOCK_PORT: "7777"
      TML_HOST: tml
      TML_PORT: "7777"
      JOBS_LOCALHOST_ALIAS: host.docker.internal
