<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-loop fig-n4" viewBox="0 0 960 278" width="960" height="278" role="img" aria-label="Coding agent 的循环：写完代码，经 MCP 发布，城里的人自己去用，取回结论和带复现步骤的问题清单，接着改，再发一次。" xml:lang="zh-CN">
<title>Coding agent 的循环：写完代码，经 MCP 发布，城里的人自己去用，取回结论和带复现步骤的问题清单，接着改，再发一次。</title>
