<g clip-path="url(#fig-card)"><rect width="960" height="598" fill="#f7f3ec"/><rect x="24" y="20" width="170" height="50" rx="10" class="f-raised s-line"/><text x="109" y="41" class="t t-d t-b t-13 t-mid">Web</text><text x="109" y="59" class="t t-m t-11 t-mid">The town comes first</text><path d="M109 74L109 96M105 92L109 96L113 92" class="s-strong no-fill"/><rect x="209.5" y="20" width="170" height="50" rx="10" class="f-raised s-line"/><text x="294.5" y="41" class="t t-d t-b t-13 t-mid">Command line</text><text x="294.5" y="59" class="t t-m t-11 t-mid t-mono">jobsworld</text><path d="M294.5 74L294.5 96M290.5 92L294.5 96L298.5 92" class="s-strong no-fill"/><rect x="395" y="20" width="170" height="50" rx="10" class="f-raised s-line"/><text x="480" y="41" class="t t-d t-b t-13 t-mid">Coding agent</text><text x="480" y="59" class="t t-m t-11 t-mid t-mono">MCP</text><path d="M480 74L480 96M476 92L480 96L484 92" class="s-strong no-fill"/><rect x="580.5" y="20" width="170" height="50" rx="10" class="f-raised s-line"/><text x="665.5" y="41" class="t t-d t-b t-13 t-mid">Feishu</text><text x="665.5" y="59" class="t t-m t-11 t-mid">Bot</text><path d="M665.5 74L665.5 96M661.5 92L665.5 96L669.5 92" class="s-strong no-fill"/><rect x="766" y="20" width="170" height="50" rx="10" class="f-raised s-line"/><text x="851" y="41" class="t t-d t-b t-13 t-mid">Terraria</text><text x="851" y="59" class="t t-m t-11 t-mid">Walk into the same town</text><path d="M851 74L851 96M847 92L851 96L855 92" class="s-strong no-fill"/><rect x="24" y="102" width="912" height="356" rx="20" class="no-fill s-strong dashed"/><text x="44" y="128" class="t t-m t-sb t-12">Your machine · Docker</text><rect x="44" y="142" width="566" height="296" rx="14" class="f-raised s-line"/><text x="62" y="168" class="t t-d t-sb t-12">Our own code: one image</text><text x="592" y="168" class="t t-s t-11 t-mono t-end">ghcr.io/plutokeating/jobs</text><rect x="60" y="182" width="534" height="38" rx="10" class="f-surface s-line"/><text x="76" y="206" class="t t-d t-b t-13">Single-port gateway :7777</text><text x="578" y="206" class="t t-m t-12 t-end">HTTP → API · Terraria → game servers</text><rect x="60" y="232" width="261" height="88" rx="10" class="f-surface s-line"/><text x="76" y="259" class="t t-d t-b t-13">API and web</text><text x="76" y="281" class="t t-m t-12">REST · live updates over WebSocket</text><text x="76" y="299" class="t t-m t-12">Feishu bot</text><rect x="333" y="232" width="261" height="88" rx="10" class="f-surface s-line"/><text x="349" y="259" class="t t-d t-b t-13">World service</text><text x="349" y="281" class="t t-m t-12">Always on: clock, schedules, needs</text><text x="349" y="299" class="t t-m t-12">Engine: meet → decide → use → talk</text><circle cx="574" cy="254" r="4" class="f-accent breath"/><rect x="60" y="332" width="261" height="88" rx="10" class="f-surface s-line"/><text x="76" y="359" class="t t-d t-b t-13">Usage sessions</text><text x="76" y="381" class="t t-m t-12">One separate Chromium per session</text><text x="76" y="399" class="t t-m t-12">Screenshot only · human hand · video</text><rect x="333" y="332" width="261" height="88" rx="10" class="f-surface s-line"/><text x="349" y="359" class="t t-d t-b t-13">Model router</text><text x="349" y="381" class="t t-m t-12">Step · Think · Locate · Embed · Image</text><text x="349" y="399" class="t t-m t-12">Many providers, failover, spend recorded</text><rect x="630" y="142" width="286" height="296" rx="14" class="f-raised s-line"/><text x="648" y="168" class="t t-d t-sb t-12">Standard images</text><rect x="646" y="182" width="254" height="52.5" rx="10" class="f-surface s-line"/><text x="662" y="205.25" class="t t-d t-b t-13">Postgres + pgvector</text><text x="662" y="223.25" class="t t-m t-11">Residents, memories, launches</text><rect x="646" y="244.5" width="254" height="52.5" rx="10" class="f-surface s-line"/><text x="662" y="267.75" class="t t-d t-b t-13">MinIO</text><text x="662" y="285.75" class="t t-m t-11">Screenshots, recordings, evidence</text><rect x="646" y="307" width="254" height="52.5" rx="10" class="f-surface s-line"/><text x="662" y="330.25" class="t t-d t-b t-13">NATS</text><text x="662" y="348.25" class="t t-m t-11">Event bus</text><rect x="646" y="369.5" width="254" height="52.5" rx="10" class="f-surface s-line dashed"/><text x="662" y="392.75" class="t t-d t-b t-13">Terraria servers (optional)</text><text x="662" y="410.75" class="t t-m t-11">TShock · tModLoader</text><path d="M612 290h16" class="s-strong no-fill"/><path d="M190.5 424L190.5 488M186.5 484L190.5 488L194.5 484" class="s-strong no-fill"/><path d="M463.5 424L463.5 488M459.5 484L463.5 488L467.5 484" class="s-strong no-fill"/><rect x="60" y="492" width="261" height="82" rx="10" class="no-fill s-strong"/><text x="76" y="519" class="t t-d t-b t-13">Your product</text><text x="76" y="540" class="t t-m t-12">Any URL this machine can reach,</text><text x="76" y="558" class="t t-m t-12">a local dev server included</text><rect x="333" y="492" width="261" height="82" rx="10" class="no-fill s-strong"/><text x="349" y="519" class="t t-d t-b t-13">The model providers you connect</text><text x="349" y="540" class="t t-m t-12">Configured on the Models page,</text><text x="349" y="558" class="t t-m t-12">live a few seconds after saving</text><text x="646" y="519" class="t t-m t-12">Residents, memories, screenshots and</text><text x="646" y="537" class="t t-m t-12">conclusions stay in Docker volumes</text><text x="646" y="555" class="t t-m t-12">on your machine.</text></g>
