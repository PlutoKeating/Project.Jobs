<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-stack" viewBox="0 0 960 598" width="960" height="598" role="img" aria-label="How Jobs is put together: the web page, the command line, coding agents, Feishu and Terraria are five ways into the same capabilities; our own code ships as one image (single-port gateway, API and web, world service, usage sessions, model router) next to standard images (Postgres, MinIO, NATS, optional game servers); everything runs on your own machine and reaches out only to your product and the model providers you connect." xml:lang="en">
<title>How Jobs is put together: the web page, the command line, coding agents, Feishu and Terraria are five ways into the same capabilities; our own code ships as one image (single-port gateway, API and web, world service, usage sessions, model router) next to standard images (Postgres, MinIO, NATS, optional game servers); everything runs on your own machine and reaches out only to your product and the model providers you connect.</title>
