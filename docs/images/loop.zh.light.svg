<g clip-path="url(#fig-card)"><rect width="960" height="300" fill="#f7f3ec"/><rect x="24" y="28" width="200" height="86" rx="12" class="f-raised s-line"/><g class="now now-1" aria-hidden="true"><rect x="24" y="28" width="200" height="86" rx="12" class="no-fill s-accent"/></g><text x="42" y="64" class="t t-d t-b t-16">写完代码</text><text x="42" y="89" class="t t-m t-14">任何支持 MCP 的 agent</text><path d="M232 71L253.33 71M249.33 67L253.33 71L249.33 75" class="s-strong no-fill"/><rect x="261.33" y="28" width="200" height="86" rx="12" class="f-raised s-line"/><g class="now now-2" aria-hidden="true"><rect x="261.33" y="28" width="200" height="86" rx="12" class="no-fill s-accent"/></g><text x="279.33" y="64" class="t t-d t-b t-16">发布</text><text x="279.33" y="89" class="t t-m t-14 t-mono">publish_product</text><path d="M469.33 71L490.67 71M486.67 67L490.67 71L486.67 75" class="s-strong no-fill"/><rect x="498.67" y="28" width="200" height="86" rx="12" class="f-raised s-line"/><g class="now now-3" aria-hidden="true"><rect x="498.67" y="28" width="200" height="86" rx="12" class="no-fill s-accent"/></g><text x="516.67" y="64" class="t t-d t-b t-16">城里的人自己去用</text><text x="516.67" y="89" class="t t-m t-14 t-mono">product_status</text><path d="M706.67 71L728 71M724 67L728 71L724 75" class="s-strong no-fill"/><rect x="736" y="28" width="200" height="86" rx="12" class="f-raised s-line"/><g class="now now-4" aria-hidden="true"><rect x="736" y="28" width="200" height="86" rx="12" class="no-fill s-accent"/></g><text x="754" y="64" class="t t-d t-b t-16">取回结论与问题</text><text x="754" y="89" class="t t-m t-14 t-mono">product_report</text><path d="M836 114V242H124V116M120 120l4 -4l4 4" class="s-strong no-fill"/><text x="193" y="211" class="t t-m t-14 t-mid">接着改，</text><text x="193" y="230" class="t t-m t-14 t-mid">再发一次</text><text x="767" y="211" class="t t-m t-14 t-mid">带复现步骤的</text><text x="767" y="230" class="t t-m t-14 t-mid">问题清单</text><rect x="262" y="138" width="436" height="138" rx="12" class="f-surface s-line"/><rect x="278" y="153" width="34" height="22" rx="6" class="no-fill s-danger"/><text x="295" y="168.5" class="t t-danger t-sb t-13 t-mid">P0</text><text x="322" y="169" class="t t-d t-sb t-14">笔记自动保存失效，退出重进后内容全部丢失</text><text x="322" y="190" class="t t-m t-13">4 人遇到</text><text x="288" y="226" class="t t-s t-13 t-mono t-end t-num">5</text><text x="298" y="226" class="t t-m t-13 t-mono">click &quot;+ 新建笔记&quot;</text><text x="494" y="226" class="t t-s t-13 t-mono t-end t-num">6</text><text x="504" y="226" class="t t-m t-13 t-mono">type &quot;内容&quot; → &quot;测试一下&quot;</text><text x="288" y="251" class="t t-s t-13 t-mono t-end t-num">7</text><text x="298" y="251" class="t t-m t-13 t-mono">click &quot;← 返回列表&quot;</text><text x="494" y="251" class="t t-s t-13 t-mono t-end t-num">8</text><text x="504" y="251" class="t t-m t-13 t-mono">click &quot;无标题&quot;</text></g>
