<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-loop fig-n4" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Coding agent 的循环：写完代码，经 MCP 发布，城里的人自己去用，取回结论和带复现步骤的问题清单，接着改，再发一次。" xml:lang="zh-CN">
<title>Coding agent 的循环：写完代码，经 MCP 发布，城里的人自己去用，取回结论和带复现步骤的问题清单，接着改，再发一次。</title>
<style>.fig text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}.fig .t{fill:#26221e;font-size:13px;font-weight:450}.fig .t-d{fill:#16130f}.fig .t-m{fill:#625b53}.fig .t-s{fill:#8d857c}.fig .t-inv{fill:#f7f3ec}.fig .t-link{fill:#4b6560}.fig .t-danger{fill:#9c4b4b}.fig .t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}.fig .t-sb{font-weight:600}.fig .t-b{font-weight:700}.fig .t-mid{text-anchor:middle}.fig .t-end{text-anchor:end}.fig .t-num{font-variant-numeric:tabular-nums}.fig .t-9{font-size:9px}.fig .t-11{font-size:11px}.fig .t-12{font-size:12px}.fig .t-13{font-size:13px}.fig .t-14{font-size:14px}.fig .t-15{font-size:15px}.fig .t-16{font-size:16px}.fig .t-19{font-size:19px}.fig .t-24{font-size:24px;letter-spacing:-0.01em}.fig .t-60{font-size:60px;letter-spacing:-0.03em}.fig .f-bg,.fig .f-card{fill:#f7f3ec}.fig .f-raised{fill:#fbf9f5}.fig .f-surface{fill:#fdfbf8}.fig .f-hover{fill:#f1ece3}.fig .f-fg{fill:#16130f}.fig .f-muted{fill:#625b53}.fig .f-subtle{fill:#8d857c}.fig .f-sage{fill:#5f726d}.fig .f-avatar{fill:#8d857c}.fig .f-accent{fill:#a5623f}.fig .f-accent-soft{fill:rgb(165 98 63 / 0.1)}.fig .f-danger{fill:#9c4b4b}.fig .no-fill{fill:none}.fig .s-line{stroke:rgb(44 38 32 / 0.1)}.fig .s-strong{stroke:rgb(44 38 32 / 0.22)}.fig .s-muted{stroke:#8d857c}.fig .s-fg{stroke:#16130f}.fig .s-sage{stroke:#5f726d}.fig .s-accent{stroke:#a5623f;stroke-width:1.5}.fig .s-danger{stroke:#9c4b4b}.fig .s-card{stroke:#f7f3ec;stroke-width:2}.fig .sw-2{stroke-width:2}.fig .dashed{stroke-dasharray:5 5}.fig .faint{opacity:0.45}.fig path,.fig line{stroke-linecap:round;stroke-linejoin:round}.fig .dot{fill:none;stroke-width:4.6;stroke-linecap:round}.fig .dot-off{stroke:rgb(44 38 32 / 0.22)}.fig .dot-on{stroke:#5f726d}.fig .now{opacity:0}.fig-n3 .now{animation:fig-now-3 7.8s cubic-bezier(0.2,0,0,1) infinite}.fig-n4 .now{animation:fig-now-4 10.4s cubic-bezier(0.2,0,0,1) infinite}.fig-n7 .now{animation:fig-now-7 18.2s cubic-bezier(0.2,0,0,1) infinite}.fig .now-2{animation-delay:2.6s}.fig .now-3{animation-delay:5.2s}.fig .now-4{animation-delay:7.8s}.fig .now-5{animation-delay:10.4s}.fig .now-6{animation-delay:13s}.fig .now-7{animation-delay:15.6s}@keyframes fig-now-3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}@keyframes fig-now-4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@keyframes fig-now-7{0%{opacity:0}1.8%,12.5%{opacity:1}14.28%,100%{opacity:0}}.fig .ripple{opacity:0.5;transform-box:fill-box;transform-origin:center;animation:fig-ripple 2.6s cubic-bezier(0.2,0,0,1) infinite}@keyframes fig-ripple{0%{opacity:0.9;transform:scale(0.4)}70%,100%{opacity:0;transform:scale(1.5)}}.fig .breath{animation:fig-breath 5000ms cubic-bezier(0.45,0,0.55,1) infinite}@keyframes fig-breath{0%,100%{opacity:0.35}50%{opacity:1}}.fig .tw{animation:fig-twinkle 9s cubic-bezier(0.45,0,0.55,1) infinite}.fig .tw-2{animation-delay:-2.2s}.fig .tw-3{animation-delay:-4.6s}.fig .tw-4{animation-delay:-6.9s}@keyframes fig-twinkle{0%,38%,100%{opacity:1}46%,72%{opacity:0.12}80%{opacity:1}}.fig .px-a{fill:#5f726d}.fig .px-b{fill:#3e4f4b}.fig .px-lit{fill:#a5623f}.fig .px-dim{fill:#f7f3ec;opacity:.5}@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}</style>
