<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-screen fig-n3" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="How a resident uses a product: they see only the screenshot, and whatever is past their reading budget or too small is blurred; they say what they think and name one action for their hand; it only counts if the screen visibly changes. Page structure, element lists and API or script errors are never handed to them, and they do not know it is a test." xml:lang="en">
<title>How a resident uses a product: they see only the screenshot, and whatever is past their reading budget or too small is blurred; they say what they think and name one action for their hand; it only counts if the screen visibly changes. Page structure, element lists and API or script errors are never handed to them, and they do not know it is a test.</title>
<style>.fig text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}.fig .t{fill:#26221e;font-size:13px;font-weight:450}.fig .t-d{fill:#16130f}.fig .t-m{fill:#625b53}.fig .t-s{fill:#8d857c}.fig .t-inv{fill:#f7f3ec}.fig .t-link{fill:#4b6560}.fig .t-danger{fill:#9c4b4b}.fig .t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}.fig .t-sb{font-weight:600}.fig .t-b{font-weight:700}.fig .t-mid{text-anchor:middle}.fig .t-end{text-anchor:end}.fig .t-num{font-variant-numeric:tabular-nums}.fig .t-8{font-size:8px}.fig .t-10{font-size:10px}.fig .t-11{font-size:11px}.fig .t-12{font-size:12px}.fig .t-13{font-size:13px}.fig .t-14{font-size:14px}.fig .t-15{font-size:15px}.fig .t-17{font-size:17px}.fig .t-19{font-size:19px}.fig .t-22{font-size:22px}.fig .t-24{font-size:24px;letter-spacing:-0.01em}.fig .t-60{font-size:60px;letter-spacing:-0.03em}.fig .f-bg,.fig .f-card{fill:#f7f3ec}.fig .f-raised{fill:#fbf9f5}.fig .f-surface{fill:#fdfbf8}.fig .f-hover{fill:#f1ece3}.fig .f-fg{fill:#16130f}.fig .f-muted{fill:#625b53}.fig .f-subtle{fill:#8d857c}.fig .f-sage{fill:#5f726d}.fig .f-avatar{fill:#8d857c}.fig .f-accent{fill:#a5623f}.fig .f-accent-soft{fill:rgb(165 98 63 / 0.1)}.fig .f-danger{fill:#9c4b4b}.fig .no-fill{fill:none}.fig .s-line{stroke:rgb(44 38 32 / 0.1)}.fig .s-strong{stroke:rgb(44 38 32 / 0.22)}.fig .s-muted{stroke:#8d857c}.fig .s-fg{stroke:#16130f}.fig .s-sage{stroke:#5f726d}.fig .s-accent{stroke:#a5623f;stroke-width:1.5}.fig .s-danger{stroke:#9c4b4b}.fig .s-card{stroke:#f7f3ec;stroke-width:2}.fig .sw-2{stroke-width:2}.fig .dashed{stroke-dasharray:5 5}.fig .faint{opacity:0.45}.fig path,.fig line{stroke-linecap:round;stroke-linejoin:round}.fig .dot{fill:none;stroke-width:4.6;stroke-linecap:round}.fig .dot-off{stroke:rgb(44 38 32 / 0.22)}.fig .dot-on{stroke:#5f726d}.fig .now{opacity:0}.fig-n3 .now{animation:fig-now-3 7.8s cubic-bezier(0.2,0,0,1) infinite}.fig-n4 .now{animation:fig-now-4 10.4s cubic-bezier(0.2,0,0,1) infinite}.fig-n7 .now{animation:fig-now-7 18.2s cubic-bezier(0.2,0,0,1) infinite}.fig .now-2{animation-delay:2.6s}.fig .now-3{animation-delay:5.2s}.fig .now-4{animation-delay:7.8s}.fig .now-5{animation-delay:10.4s}.fig .now-6{animation-delay:13s}.fig .now-7{animation-delay:15.6s}@keyframes fig-now-3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}@keyframes fig-now-4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@keyframes fig-now-7{0%{opacity:0}1.8%,12.5%{opacity:1}14.28%,100%{opacity:0}}.fig .ripple{opacity:0.5;transform-box:fill-box;transform-origin:center;animation:fig-ripple 2.6s cubic-bezier(0.2,0,0,1) infinite}@keyframes fig-ripple{0%{opacity:0.9;transform:scale(0.4)}70%,100%{opacity:0;transform:scale(1.5)}}.fig .breath{animation:fig-breath 5000ms cubic-bezier(0.45,0,0.55,1) infinite}@keyframes fig-breath{0%,100%{opacity:0.35}50%{opacity:1}}.fig .tw{animation:fig-twinkle 9s cubic-bezier(0.45,0,0.55,1) infinite}.fig .tw-2{animation-delay:-2.2s}.fig .tw-3{animation-delay:-4.6s}.fig .tw-4{animation-delay:-6.9s}@keyframes fig-twinkle{0%,38%,100%{opacity:1}46%,72%{opacity:0.12}80%{opacity:1}}.fig .px-a{fill:#5f726d}.fig .px-b{fill:#3e4f4b}.fig .px-lit{fill:#a5623f}.fig .px-dim{fill:#f7f3ec;opacity:.5}@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}</style>
<defs><clipPath id="fig-card"><rect width="960" height="452" rx="16"/></clipPath></defs>
<g clip-path="url(#fig-card)"><rect width="960" height="452" fill="#f7f3ec"/><defs><filter id="fig-blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4"/></filter></defs><text x="26" y="34" class="t t-d t-b t-14">One look</text><rect x="24" y="50" width="288" height="292" rx="14" class="f-raised s-line"/><g class="now now-1" aria-hidden="true"><rect x="24" y="50" width="288" height="292" rx="14" class="no-fill s-accent"/></g><path d="M318 196L330 196M326 192L330 196L326 200" class="s-strong no-fill"/><text x="338" y="34" class="t t-d t-b t-14">What she thinks</text><rect x="336" y="50" width="288" height="292" rx="14" class="f-raised s-line"/><g class="now now-2" aria-hidden="true"><rect x="336" y="50" width="288" height="292" rx="14" class="no-fill s-accent"/></g><path d="M630 196L642 196M638 192L642 196L638 200" class="s-strong no-fill"/><text x="650" y="34" class="t t-d t-b t-14">One action</text><rect x="648" y="50" width="288" height="292" rx="14" class="f-raised s-line"/><g class="now now-3" aria-hidden="true"><rect x="648" y="50" width="288" height="292" rx="14" class="no-fill s-accent"/></g><rect x="48" y="72" width="132" height="248" rx="16" class="f-bg s-strong"/><rect x="55" y="79" width="118" height="30" rx="9" class="f-hover"/><text x="66" y="99" class="t t-d t-sb t-11">闪念笔记</text><text x="64" y="132" class="t t-m t-10">用户名</text><rect x="64" y="138" width="100" height="20" rx="5" class="no-fill s-strong"/><text x="64" y="176" class="t t-m t-10">密码</text><rect x="64" y="182" width="100" height="20" rx="5" class="no-fill s-strong"/><rect x="64" y="214" width="100" height="22" rx="6" class="f-fg"/><text x="114" y="229" class="t t-inv t-sb t-10 t-mid">登录</text><text x="114" y="256" class="t t-d t-10 t-mid">没有账号？注册一个</text><path d="M72 260L156 260" class="s-muted"/><g filter="url(#fig-blur)"><rect x="66" y="276" width="92" height="3.5" rx="1.5" class="f-muted"/><rect x="66" y="285" width="80" height="3.5" rx="1.5" class="f-muted"/><rect x="66" y="294" width="96" height="3.5" rx="1.5" class="f-muted"/><rect x="66" y="303" width="56" height="3.5" rx="1.5" class="f-muted"/></g><path d="M184 170L194 170" class="s-strong"/><text x="198" y="164" class="t t-m t-12">What one glance</text><text x="198" y="181" class="t t-m t-12">can take in</text><path d="M184 290L194 290" class="s-strong"/><text x="198" y="275" class="t t-m t-12">Past the reading</text><text x="198" y="292" class="t t-m t-12">budget, or too</text><text x="198" y="309" class="t t-m t-12">small: blurred</text><circle cx="372" cy="88" r="16" class="f-sage"/><circle cx="372" cy="83" r="5.5" class="f-bg"/><path d="M362 99a10 9 0 0 1 20 0z" class="f-bg"/><text x="398" y="85" class="t t-d t-b t-14">Zhao Hongmei</text><text x="398" y="103" class="t t-m t-12">56, retired civil servant</text><rect x="356" y="120" width="58" height="24" rx="12" class="no-fill s-strong"/><text x="385" y="136.32" class="t t-mid t-m t-12">12:35</text><rect x="422" y="120" width="144" height="24" rx="12" class="no-fill s-strong"/><text x="494" y="136.32" class="t t-mid t-m t-12">On the sofa at home</text><rect x="356" y="152" width="96" height="24" rx="12" class="no-fill s-strong"/><text x="404" y="168.32" class="t t-mid t-m t-12">Having lunch</text><rect x="460" y="152" width="57" height="24" rx="12" class="no-fill s-strong"/><text x="488.5" y="168.32" class="t t-mid t-m t-12">Phone</text><rect x="356" y="190" width="248" height="122" rx="12" class="f-surface s-line"/><text x="370" y="216" class="t t-d t-13">“I have to log in first? I don’t</text><text x="370" y="236" class="t t-d t-13">have an account. Let me tap this</text><text x="370" y="256" class="t t-d t-13">‘No account? Sign up’ and see</text><text x="370" y="276" class="t t-d t-13">how much trouble it is. If it’s</text><text x="370" y="296" class="t t-d t-13">a hassle, I won’t bother.”</text><rect x="668" y="72" width="44" height="24" rx="12" class="f-hover"/><text x="690" y="88.5" class="t t-d t-sb t-12 t-mid">Tap</text><rect x="668" y="110" width="248" height="58" rx="10" class="f-bg s-strong"/><text x="774" y="144" class="t t-d t-14 t-mid">没有账号？注册一个</text><path d="M710 150L838 150" class="s-muted"/><circle cx="880" cy="146" r="15" class="no-fill s-accent ripple"/><circle cx="880" cy="146" r="5.5" class="f-accent"/><text x="734" y="194" class="t t-m t-11 t-mid">Before</text><rect x="702" y="202" width="64" height="88" rx="9" class="f-bg s-strong"/><rect x="707" y="207" width="54" height="12" rx="4" class="f-hover"/><rect x="711" y="228" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="711" y="244" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="711" y="260" width="46" height="10" rx="3" class="f-fg"/><rect x="718" y="277" width="32" height="2.5" rx="1" class="f-muted"/><path d="M780 246L806 246M802 242L806 246L802 250" class="s-strong no-fill"/><text x="852" y="194" class="t t-m t-11 t-mid">After</text><rect x="820" y="202" width="64" height="88" rx="9" class="f-bg s-strong"/><rect x="825" y="207" width="54" height="12" rx="4" class="f-hover"/><text x="830" y="216" class="t t-d t-sb t-8">注册</text><rect x="829" y="226" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="829" y="240" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="829" y="254" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="829" y="270" width="46" height="10" rx="3" class="f-fg"/><text x="792" y="314" class="t t-m t-12 t-mid">It only counts if the screen</text><text x="792" y="331" class="t t-m t-12 t-mid">visibly changes</text><path d="M792 342V368H168V344M164 348l4 -4l4 4" class="s-strong no-fill"/><rect x="440.04" y="357" width="79.92" height="22" rx="11" class="f-card"/><text x="480" y="372" class="t t-m t-12 t-mid">Next look</text><text x="24" y="420" class="t t-d t-sb t-12">Never handed to them</text><rect x="172.8" y="404" width="115" height="24" rx="12" class="no-fill s-line dashed"/><text x="230.3" y="420.32" class="t t-mid t-s t-12">Page structure</text><path d="M181.8 416L278.8 416" class="s-muted"/><rect x="295.8" y="404" width="103" height="24" rx="12" class="no-fill s-line dashed"/><text x="347.3" y="420.32" class="t t-mid t-s t-12">Element lists</text><path d="M304.8 416L389.8 416" class="s-muted"/><rect x="406.8" y="404" width="156" height="24" rx="12" class="no-fill s-line dashed"/><text x="484.8" y="420.32" class="t t-mid t-s t-12">API and script errors</text><path d="M415.8 416L553.8 416" class="s-muted"/><rect x="570.8" y="404" width="111" height="24" rx="12" class="no-fill s-line dashed"/><text x="626.3" y="420.32" class="t t-mid t-s t-12">“This is a test”</text><path d="M579.8 416L672.8 416" class="s-muted"/></g>
<rect x="0.5" y="0.5" width="959" height="451" rx="15.5" fill="none" stroke="rgb(44 38 32 / 0.22)"/>
