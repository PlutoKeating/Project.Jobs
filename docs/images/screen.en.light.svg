<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-screen fig-n3" viewBox="0 0 960 506" width="960" height="506" role="img" aria-label="How a resident uses a product: they see only the screenshot, and whatever is past their reading budget or too small is blurred; they say what they think and name one action for their hand; it only counts if the screen visibly changes. Page structure, element lists and API or script errors are never handed to them, and they do not know it is a test." xml:lang="en">
<title>How a resident uses a product: they see only the screenshot, and whatever is past their reading budget or too small is blurred; they say what they think and name one action for their hand; it only counts if the screen visibly changes. Page structure, element lists and API or script errors are never handed to them, and they do not know it is a test.</title>
<style>.fig text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}.fig .t{fill:#26221e;font-size:13px;font-weight:450}.fig .t-d{fill:#16130f}.fig .t-m{fill:#625b53}.fig .t-s{fill:#8d857c}.fig .t-inv{fill:#f7f3ec}.fig .t-link{fill:#4b6560}.fig .t-danger{fill:#9c4b4b}.fig .t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}.fig .t-sb{font-weight:600}.fig .t-b{font-weight:700}.fig .t-mid{text-anchor:middle}.fig .t-end{text-anchor:end}.fig .t-num{font-variant-numeric:tabular-nums}.fig .t-9{font-size:9px}.fig .t-11{font-size:11px}.fig .t-12{font-size:12px}.fig .t-13{font-size:13px}.fig .t-14{font-size:14px}.fig .t-15{font-size:15px}.fig .t-16{font-size:16px}.fig .t-19{font-size:19px}.fig .t-24{font-size:24px;letter-spacing:-0.01em}.fig .t-60{font-size:60px;letter-spacing:-0.03em}.fig .f-bg,.fig .f-card{fill:#f7f3ec}.fig .f-inset{fill:#f7f3ec}.fig .f-track{fill:rgb(44 38 32 / 0.1)}.fig .f-danger-wash{fill:#9c4b4b;fill-opacity:0.07}.fig .s-hl{stroke:#fffefc;stroke-opacity:0.09}.fig .fx-shadow{flood-color:rgb(38 34 30 / 0.4);flood-opacity:0.55}.fig .f-raised{fill:#fbf9f5}.fig .f-surface{fill:#fdfbf8}.fig .f-hover{fill:#f1ece3}.fig .f-fg{fill:#16130f}.fig .f-muted{fill:#625b53}.fig .f-subtle{fill:#8d857c}.fig .f-sage{fill:#5f726d}.fig .f-avatar{fill:#8d857c}.fig .f-accent{fill:#a5623f}.fig .f-accent-soft{fill:rgb(165 98 63 / 0.1)}.fig .f-danger{fill:#9c4b4b}.fig .no-fill{fill:none}.fig .s-line{stroke:rgb(44 38 32 / 0.1)}.fig .s-strong{stroke:rgb(44 38 32 / 0.22)}.fig .s-muted{stroke:#8d857c}.fig .s-fg{stroke:#16130f}.fig .s-sage{stroke:#5f726d}.fig .s-accent{stroke:#a5623f;stroke-width:1.5}.fig .s-danger{stroke:#9c4b4b}.fig .s-card{stroke:#f7f3ec;stroke-width:2}.fig .sw-2{stroke-width:2}.fig .dashed{stroke-dasharray:5 5}.fig .faint{opacity:0.45}.fig path,.fig line{stroke-linecap:round;stroke-linejoin:round}.fig .dot{fill:none;stroke-width:4.6;stroke-linecap:round}.fig .dot-off{stroke:rgb(44 38 32 / 0.22)}.fig .dot-on{stroke:#5f726d}.fig .now{opacity:0}.fig-n3 .now{animation:fig-now-3 7.8s cubic-bezier(0.2,0,0,1) infinite}.fig-n4 .now{animation:fig-now-4 10.4s cubic-bezier(0.2,0,0,1) infinite}.fig-n7 .now{animation:fig-now-7 18.2s cubic-bezier(0.2,0,0,1) infinite}.fig .now-2{animation-delay:2.6s}.fig .now-3{animation-delay:5.2s}.fig .now-4{animation-delay:7.8s}.fig .now-5{animation-delay:10.4s}.fig .now-6{animation-delay:13s}.fig .now-7{animation-delay:15.6s}@keyframes fig-now-3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}@keyframes fig-now-4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@keyframes fig-now-7{0%{opacity:0}1.8%,12.5%{opacity:1}14.28%,100%{opacity:0}}.fig .ripple{opacity:0.5;transform-box:fill-box;transform-origin:center;animation:fig-ripple 2.6s cubic-bezier(0.2,0,0,1) infinite}@keyframes fig-ripple{0%{opacity:0.9;transform:scale(0.4)}70%,100%{opacity:0;transform:scale(1.5)}}.fig .breath{animation:fig-breath 5000ms cubic-bezier(0.45,0,0.55,1) infinite}@keyframes fig-breath{0%,100%{opacity:0.35}50%{opacity:1}}.fig .tw{animation:fig-twinkle 9s cubic-bezier(0.45,0,0.55,1) infinite}.fig .tw-2{animation-delay:-2.2s}.fig .tw-3{animation-delay:-4.6s}.fig .tw-4{animation-delay:-6.9s}@keyframes fig-twinkle{0%,38%,100%{opacity:1}46%,72%{opacity:0.12}80%{opacity:1}}.fig .px-a{fill:#5f726d}.fig .px-b{fill:#3e4f4b}.fig .px-lit{fill:#a5623f}.fig .px-dim{fill:#f7f3ec;opacity:.5}@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}</style>
<defs><clipPath id="fig-card"><rect width="960" height="506" rx="16"/></clipPath></defs>
<g clip-path="url(#fig-card)"><rect width="960" height="506" fill="#f7f3ec"/><defs><filter id="fx-screen" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow class="fx-shadow" dx="0" dy="6" stdDeviation="9"/></filter></defs><defs><filter id="fig-blur" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4"/></filter></defs><text x="26" y="35" class="t t-d t-b t-16">One look</text><rect x="24" y="52" width="288" height="336" rx="14" class="f-surface s-line" filter="url(#fx-screen)"/><path d="M38 52.75H298" class="s-hl no-fill"/><g class="now now-1" aria-hidden="true"><rect x="24" y="52" width="288" height="336" rx="14" class="no-fill s-accent"/></g><path d="M318 220L330 220M326 216L330 220L326 224" class="s-strong no-fill"/><text x="338" y="35" class="t t-d t-b t-16">What she thinks</text><rect x="336" y="52" width="288" height="336" rx="14" class="f-surface s-line" filter="url(#fx-screen)"/><path d="M350 52.75H610" class="s-hl no-fill"/><g class="now now-2" aria-hidden="true"><rect x="336" y="52" width="288" height="336" rx="14" class="no-fill s-accent"/></g><path d="M630 220L642 220M638 216L642 220L638 224" class="s-strong no-fill"/><text x="650" y="35" class="t t-d t-b t-16">One action</text><rect x="648" y="52" width="288" height="336" rx="14" class="f-surface s-line" filter="url(#fx-screen)"/><path d="M662 52.75H922" class="s-hl no-fill"/><g class="now now-3" aria-hidden="true"><rect x="648" y="52" width="288" height="336" rx="14" class="no-fill s-accent"/></g><rect x="44" y="92" width="126" height="256" rx="16" class="f-bg s-strong" filter="url(#fx-screen)"/><rect x="51" y="99" width="112" height="32" rx="9" class="f-hover"/><text x="61" y="120" class="t t-d t-sb t-12">闪念笔记</text><text x="59" y="154" class="t t-m t-11">用户名</text><rect x="59" y="160" width="96" height="21" rx="5" class="no-fill s-strong"/><text x="59" y="200" class="t t-m t-11">密码</text><rect x="59" y="206" width="96" height="21" rx="5" class="no-fill s-strong"/><rect x="59" y="239" width="96" height="24" rx="6" class="f-fg"/><text x="107" y="255" class="t t-inv t-sb t-11 t-mid">登录</text><text x="107" y="284" class="t t-d t-11 t-mid">没有账号？注册一个</text><path d="M60 289L154 289" class="s-muted"/><g filter="url(#fig-blur)"><rect x="61" y="304" width="90" height="3.5" rx="1.5" class="f-muted"/><rect x="61" y="313" width="78" height="3.5" rx="1.5" class="f-muted"/><rect x="61" y="322" width="92" height="3.5" rx="1.5" class="f-muted"/><rect x="61" y="331" width="54" height="3.5" rx="1.5" class="f-muted"/></g><path d="M174 192L182 192" class="s-strong"/><text x="186" y="188" class="t t-m t-14">What one glance</text><text x="186" y="207" class="t t-m t-14">can take in</text><path d="M174 318L182 318" class="s-strong"/><text x="186" y="266" class="t t-m t-14">Past the</text><text x="186" y="285" class="t t-m t-14">reading budget,</text><text x="186" y="304" class="t t-m t-14">or too small:</text><text x="186" y="323" class="t t-m t-14">blurred</text><circle cx="373" cy="92" r="17" class="f-sage"/><circle cx="373" cy="87" r="5.8" class="f-bg"/><path d="M362.5 104a10.5 9.5 0 0 1 21 0z" class="f-bg"/><text x="401" y="89" class="t t-d t-b t-16">Zhao Hongmei</text><text x="401" y="109" class="t t-m t-14">56, retired civil servant</text><rect x="356" y="126" width="66" height="28" rx="14" class="no-fill s-strong"/><text x="389" y="145.04" class="t t-mid t-m t-14">12:35</text><rect x="430" y="126" width="166" height="28" rx="14" class="no-fill s-strong"/><text x="513" y="145.04" class="t t-mid t-m t-14">On the sofa at home</text><rect x="356" y="162" width="110" height="28" rx="14" class="no-fill s-strong"/><text x="411" y="181.04" class="t t-mid t-m t-14">Having lunch</text><rect x="474" y="162" width="65" height="28" rx="14" class="no-fill s-strong"/><text x="506.5" y="181.04" class="t t-mid t-m t-14">Phone</text><rect x="356" y="204" width="248" height="164" rx="12" class="f-inset s-line"/><text x="370" y="232" class="t t-d t-15">“I have to log in first? I</text><text x="370" y="254" class="t t-d t-15">don’t have an account. Let</text><text x="370" y="276" class="t t-d t-15">me tap this ‘No account?</text><text x="370" y="298" class="t t-d t-15">Sign up’ and see how much</text><text x="370" y="320" class="t t-d t-15">trouble it is. If it’s a</text><text x="370" y="342" class="t t-d t-15">hassle, I won’t bother.”</text><rect x="668" y="74" width="53" height="28" rx="14" class="f-hover"/><text x="694.5" y="93" class="t t-d t-sb t-14 t-mid">Tap</text><rect x="668" y="116" width="248" height="62" rx="10" class="f-bg s-strong" filter="url(#fx-screen)"/><text x="768" y="152.5" class="t t-d t-16 t-mid">没有账号？注册一个</text><path d="M696 159L840 159" class="s-muted"/><circle cx="882" cy="150" r="15" class="no-fill s-accent ripple"/><circle cx="882" cy="150" r="5.5" class="f-accent"/><text x="734" y="210" class="t t-m t-13 t-mid">Before</text><rect x="702" y="220" width="64" height="88" rx="9" class="f-bg s-strong"/><rect x="707" y="225" width="54" height="13" rx="4" class="f-hover"/><rect x="711" y="247" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="711" y="263" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="711" y="279" width="46" height="10" rx="3" class="f-fg"/><rect x="718" y="296" width="32" height="2.5" rx="1" class="f-muted"/><path d="M780 264L806 264M802 260L806 264L802 268" class="s-strong no-fill"/><text x="852" y="210" class="t t-m t-13 t-mid">After</text><rect x="820" y="220" width="64" height="88" rx="9" class="f-bg s-strong"/><rect x="825" y="225" width="54" height="13" rx="4" class="f-hover"/><text x="830" y="235" class="t t-d t-sb t-9">注册</text><rect x="829" y="245" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="829" y="259" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="829" y="273" width="46" height="9" rx="2.5" class="no-fill s-strong"/><rect x="829" y="289" width="46" height="10" rx="3" class="f-fg"/><text x="792" y="336" class="t t-m t-14 t-mid">It only counts if the screen</text><text x="792" y="355" class="t t-m t-14 t-mid">visibly changes</text><path d="M792 388V416H168V390M164 394l4 -4l4 4" class="s-strong no-fill"/><rect x="433.38" y="404" width="93.24" height="24" rx="12" class="f-card"/><text x="480" y="421" class="t t-m t-14 t-mid">Next look</text><text x="24" y="473" class="t t-d t-sb t-14">Never handed to them</text><rect x="196.6" y="454" width="132" height="28" rx="14" class="no-fill s-line dashed"/><text x="262.6" y="473.04" class="t t-mid t-s t-14">Page structure</text><path d="M206.6 468L318.6 468" class="s-muted"/><rect x="336.6" y="454" width="119" height="28" rx="14" class="no-fill s-line dashed"/><text x="396.1" y="473.04" class="t t-mid t-s t-14">Element lists</text><path d="M346.6 468L445.6 468" class="s-muted"/><rect x="463.6" y="454" width="180" height="28" rx="14" class="no-fill s-line dashed"/><text x="553.6" y="473.04" class="t t-mid t-s t-14">API and script errors</text><path d="M473.6 468L633.6 468" class="s-muted"/><rect x="651.6" y="454" width="128" height="28" rx="14" class="no-fill s-line dashed"/><text x="715.6" y="473.04" class="t t-mid t-s t-14">“This is a test”</text><path d="M661.6 468L769.6 468" class="s-muted"/></g>
<rect x="0.5" y="0.5" width="959" height="505" rx="15.5" fill="none" stroke="rgb(44 38 32 / 0.22)"/>
