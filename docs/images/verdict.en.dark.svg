775.8" y="328" width="4" height="11" rx="5.5" class="f-sage"/><text x="904" y="338" class="t t-b t-16 t-end t-num t-d">4</text><text x="680" y="368" class="t t-m t-14">Came back</text><rect x="775.8" y="358" width="88.2" height="11" rx="5.5" class="f-track"/><text x="904" y="368" class="t t-b t-16 t-end t-num t-s">0</text><rect x="662" y="396" width="260" height="84" rx="14" class="f-surface s-line" filter="url(#fx-verdict)"/><path d="M676 396.75H908" class="s-hl no-fill"/><text x="680" y="430" class="t t-d t-b t-15">Promotion</text><text x="904" y="430" class="t t-d t-15 t-end t-num">90%</text><path d="M680 456L904 456" class="s-strong"/><path d="M680 456H881.6" class="s-fg sw-2"/><circle cx="881.6" cy="456" r="7" class="f-fg s-card sw-2"/><rect x="662" y="492" width="260" height="104" rx="14" class="f-surface s-line" filter="url(#fx-verdict)"/><path d="M676 492.75H908" class="s-hl no-fill"/><text x="680" y="526" class="t t-d t-b t-15">Hand it to a few people</text><rect x="680" y="544" width="88" height="36" rx="10" class="f-inset s-line"/><text x="697" y="567.5" class="t t-m t-16 t-mid">−</text><text x="724" y="567" class="t t-d t-15 t-mid t-num">3</text><text x="751" y="567.5" class="t t-m t-16 t-mid">+</text><rect x="778" y="544" width="126" height="36" rx="10" class="f-hover s-strong"/><text x="841" y="567" class="t t-d t-sb t-15 t-mid">Hand it over</text><rect x="25" y="25" width="910" height="124" rx="17" class="f-raised"/><rect x="25" y="100" width="910" height="49" class="f-raised"/><path d="M25 149L935 149" class="s-line"/><text x="76" y="64" class="t t-d t-b t-19">闪念笔记 (Quick Notes)</text><text x="76" y="86" class="t t-m t-14">Write it down the moment you think of it. Saves automatically.</text><rect x="76" y="102" width="288" height="34" rx="10" class="f-inset s-line"/><rect x="79" y="105" width="79" height="28" rx="7" class="f-hover s-line"/><text x="118.5" y="124" class="t t-14 t-mid t-d t-sb">Verdict</text><text x="194" y="124" class="t t-14 t-mid t-m">People</text><text x="295.5" y="124" class="t t-14 t-mid t-m">Word of mouth</text><text x="614" y="124" class="t t-m t-14 t-end">Engineering</text><rect x="58" y="172" width="574" height="130" rx="14" class="f-surface s-line" filter="url(#fx-verdict)"/><path d="M72 172.75H618" class="s-hl no-fill"/><rect x="58" y="172" width="574" height="130" rx="14" class="f-danger-wash"/><text x="76" y="214" class="t t-d t-b t-24">Auto-save saved nothing.</text><text x="76" y="246" class="t t-d t-b t-24">All three who tried it left.</text><circle cx="81" cy="275" r="4.5" class="f-danger"/><text x="95" y="280" class="t t-15"><tspan class="t-d t-sb">Most people give up</tspan><tspan class="t-m"> · 3 used it</tspan></text><text x="76" y="336" class="t t-d t-b t-16">What hurt most</text><text x="76" y="384" class="t t-d t-15">They wrote a title and a note, saw “Auto-saved” at the</text><text x="76" y="407" class="t t-d t-15">bottom and no save button, and went back to the list.</text><text x="76" y="430" class="t t-d t-15">Every title now read “Untitled”, and the note they had</text><text x="76" y="453" class="t t-d t-15">just typed was empty. All three had wasted their effort</text><text x="76" y="476" class="t t-d t-15">and left.</text><circle cx="560" cy="379" r="9" class="f-avatar s-card"/><circle cx="573" cy="379" r="9" class="f-avatar s-card"/><circle cx="586" cy="379" r="9" class="f-avatar s-card"/><path d="M604 381l5 -5l5 5" class="s-muted no-fill"/><circle cx="102" cy="533" r="12" class="f-sage"/><circle cx="102" cy="529" r="4.2" class="f-bg"/><path d="M94.5 542a7.5 7 0 0 1 15 0z" class="f-bg"/><text x="126" y="532" class="t t-15"><tspan class="t-d t-b">Zhou Shihan</tspan><tspan class="t-m"> · 29, livestream seller</tspan></text><text x="126" y="558" class="t t-d t-15">“What? It’s all empty! I wrote a title and the</text><text x="126" y="581" class="t t-d t-15">text just now. What happened to auto-save? This</text><text x="126" y="604" class="t t-d t-15">thing can’t even keep what I type. What a waste</text><text x="126" y="627" class="t t-d t-15">of time. I’m done!”</text><text x="126" y="656" class="t t-link t-14">Open session →</text><rect x="484" y="518" width="116" height="88" rx="8" class="f-surface s-strong" filter="url(#fx-verdict)"/><rect x="489" y="523" width="106" height="17" rx="4" class="f-hover"/><text x="496" y="535" class="t t-d t-sb t-9">闪念笔记</text><rect x="494" y="548" width="96" height="15" rx="3" class="no-fill s-strong"/><text x="500" y="559" class="t t-s t-9">无标题</text><rect x="494" y="568" width="96" height="19" rx="3" class="no-fill s-strong"/><text x="542" y="600" class="t t-m t-9 t-mid">已自动保存</text><text x="76" y="735" class="t t-d t-15">It asks you to log in before you can write anything.</text><circle cx="560" cy="730" r="9" class="f-avatar s-card"/><circle cx="573" cy="730" r="9" class="f-avatar s-card"/><circle cx="586" cy="730" r="9" class="f-avatar s-card"/><path d="M604 727l5 5l5 -5" class="s-muted no-fill"/><circle cx="40" cy="206" r="10" class="f-card s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="40" cy="206" r="10" class="f-accent-soft s-accent"/></g><text x="40" y="210.5" class="t t-m t-sb t-13 t-mid t-num">1</text><circle cx="40" cy="379" r="10" class="f-card s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="40" cy="379" r="10" class="f-accent-soft s-accent"/></g><text x="40" y="383.5" class="t t-m t-sb t-13 t-mid t-num">2</text><circle cx="40" cy="527" r="10" class="f-card s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="40" cy="527" r="10" class="f-accent-soft s-accent"/></g><text x="40" y="531.5" class="t t-m t-sb t-13 t-mid t-num">3</text><circle cx="648" cy="202" r="10" class="f-card s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="648" cy="202" r="10" class="f-accent-soft s-accent"/></g><text x="648" y="206.5" class="t t-m t-sb t-13 t-mid t-num">4</text><circle cx="36" cy="813" r="10" class="no-fill s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="36" cy="813" r="10" class="f-accent-soft s-accent"/></g><text x="36" y="817.5" class="t t-m t-sb t-13 t-mid t-num">1</text><text x="56" y="818" class="t t-m t-14">A one-line verdict</text><circle cx="264" cy="813" r="10" class="no-fill s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="264" cy="813" r="10" class="f-accent-soft s-accent"/></g><text x="264" y="817.5" class="t t-m t-sb t-13 t-mid t-num">2</text><text x="284" y="818" class="t t-m t-14">Every sentence opens</text><circle cx="492" cy="813" r="10" class="no-fill s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="492" cy="813" r="10" class="f-accent-soft s-accent"/></g><text x="492" y="817.5" class="t t-m t-sb t-13 t-mid t-num">3</text><text x="512" y="818" class="t t-m t-14">Who said it, their words,</text><text x="512" y="837" class="t t-m t-14">the screen at that moment</text><circle cx="720" cy="813" r="10" class="no-fill s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="720" cy="813" r="10" class="f-accent-soft s-accent"/></g><text x="720" y="817.5" class="t t-m t-sb t-13 t-mid t-num">4</text><text x="740" y="818" class="t t-m t-14">Head counts are always</text><text x="740" y="837" class="t t-m t-14">labelled “simulated”</text></g>
