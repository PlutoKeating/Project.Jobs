-linejoin:round}.fig .dot{fill:none;stroke-width:4.6;stroke-linecap:round}.fig .dot-off{stroke:rgb(232 228 221 / 0.18)}.fig .dot-on{stroke:#7d8f8a}.fig .now{opacity:0}.fig-n3 .now{animation:fig-now-3 7.8s cubic-bezier(0.2,0,0,1) infinite}.fig-n4 .now{animation:fig-now-4 10.4s cubic-bezier(0.2,0,0,1) infinite}.fig-n7 .now{animation:fig-now-7 18.2s cubic-bezier(0.2,0,0,1) infinite}.fig .now-2{animation-delay:2.6s}.fig .now-3{animation-delay:5.2s}.fig .now-4{animation-delay:7.8s}.fig .now-5{animation-delay:10.4s}.fig .now-6{animation-delay:13s}.fig .now-7{animation-delay:15.6s}@keyframes fig-now-3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}@keyframes fig-now-4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@keyframes fig-now-7{0%{opacity:0}1.8%,12.5%{opacity:1}14.28%,100%{opacity:0}}.fig .ripple{opacity:0.5;transform-box:fill-box;transform-origin:center;animation:fig-ripple 2.6s cubic-bezier(0.2,0,0,1) infinite}@keyframes fig-ripple{0%{opacity:0.9;transform:scale(0.4)}70%,100%{opacity:0;transform:scale(1.5)}}.fig .breath{animation:fig-breath 5000ms cubic-bezier(0.45,0,0.55,1) infinite}@keyframes fig-breath{0%,100%{opacity:0.35}50%{opacity:1}}.fig .tw{animation:fig-twinkle 9s cubic-bezier(0.45,0,0.55,1) infinite}.fig .tw-2{animation-delay:-2.2s}.fig .tw-3{animation-delay:-4.6s}.fig .tw-4{animation-delay:-6.9s}@keyframes fig-twinkle{0%,38%,100%{opacity:1}46%,72%{opacity:0.12}80%{opacity:1}}.fig .px-a{fill:#7d8f8a}.fig .px-b{fill:#c2cfcb}.fig .px-lit{fill:#f0a35e}.fig .px-dim{fill:#0e0f11;opacity:.5}@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}</style>
