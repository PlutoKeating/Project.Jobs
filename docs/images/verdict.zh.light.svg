-sage"/><text x="904" y="338" class="t t-b t-16 t-end t-num t-d">4</text><text x="680" y="368" class="t t-m t-14">回来再用</text><rect x="752" y="358" width="112" height="11" rx="5.5" class="f-track"/><text x="904" y="368" class="t t-b t-16 t-end t-num t-s">0</text><rect x="662" y="396" width="260" height="84" rx="14" class="f-surface s-line" filter="url(#fx-verdict)"/><path d="M676 396.75H908" class="s-hl no-fill"/><text x="680" y="430" class="t t-d t-b t-15">宣发强度</text><text x="904" y="430" class="t t-d t-15 t-end t-num">90%</text><path d="M680 456L904 456" class="s-strong"/><path d="M680 456H881.6" class="s-fg sw-2"/><circle cx="881.6" cy="456" r="7" class="f-fg s-card sw-2"/><rect x="662" y="492" width="260" height="104" rx="14" class="f-surface s-line" filter="url(#fx-verdict)"/><path d="M676 492.75H908" class="s-hl no-fill"/><text x="680" y="526" class="t t-d t-b t-15">把手机递给几个人</text><rect x="680" y="544" width="88" height="36" rx="10" class="f-inset s-line"/><text x="697" y="567.5" class="t t-m t-16 t-mid">−</text><text x="724" y="567" class="t t-d t-15 t-mid t-num">3</text><text x="751" y="567.5" class="t t-m t-16 t-mid">+</text><rect x="778" y="544" width="126" height="36" rx="10" class="f-hover s-strong"/><text x="841" y="567" class="t t-d t-sb t-15 t-mid">递过去</text><rect x="25" y="25" width="910" height="124" rx="17" class="f-raised"/><rect x="25" y="100" width="910" height="49" class="f-raised"/><path d="M25 149L935 149" class="s-line"/><text x="76" y="64" class="t t-d t-b t-19">闪念笔记</text><text x="76" y="86" class="t t-m t-14">想到什么，马上记下，自动保存</text><rect x="76" y="102" width="154" height="34" rx="10" class="f-inset s-line"/><rect x="79" y="105" width="54" height="28" rx="7" class="f-hover s-line"/><text x="106" y="124" class="t t-14 t-mid t-d t-sb">结论</text><text x="153" y="124" class="t t-14 t-mid t-m">人</text><text x="200" y="124" class="t t-14 t-mid t-m">口碑</text><text x="614" y="124" class="t t-m t-14 t-end">工程附录</text><rect x="58" y="172" width="574" height="98" rx="14" class="f-surface s-line" filter="url(#fx-verdict)"/><path d="M72 172.75H618" class="s-hl no-fill"/><rect x="58" y="172" width="574" height="98" rx="14" class="f-danger-wash"/><text x="76" y="214" class="t t-d t-b t-24">自动保存形同虚设，仅有的 3 个用户全气走了</text><circle cx="81" cy="243" r="4.5" class="f-danger"/><text x="95" y="248" class="t t-15"><tspan class="t-d t-sb">多数人用不下去</tspan><tspan class="t-m"> · 3 人用过</tspan></text><text x="76" y="304" class="t t-d t-b t-16">最让人难受的地方</text><text x="76" y="352" class="t t-d t-15">大家写完标题和正文想存下来，看到页面底下写着「已自动保存」</text><text x="76" y="375" class="t t-d t-15">又没有保存按钮，就放心地退回笔记列表，结果标题全变成了</text><text x="76" y="398" class="t t-d t-15">「无标题」，再点进去，刚才打的字空空如也。三个人全都白忙活</text><text x="76" y="421" class="t t-d t-15">一场，直接气走了。</text><circle cx="560" cy="347" r="9" class="f-avatar s-card"/><circle cx="573" cy="347" r="9" class="f-avatar s-card"/><circle cx="586" cy="347" r="9" class="f-avatar s-card"/><path d="M604 349l5 -5l5 5" class="s-muted no-fill"/><circle cx="102" cy="478" r="12" class="f-sage"/><circle cx="102" cy="474" r="4.2" class="f-bg"/><path d="M94.5 487a7.5 7 0 0 1 15 0z" class="f-bg"/><text x="126" y="477" class="t t-15"><tspan class="t-d t-b">周诗涵</tspan><tspan class="t-m"> · 29 岁，带货主播</tspan></text><text x="126" y="503" class="t t-d t-15">“啊？怎么全都是空的！我刚才明明写了标题</text><text x="126" y="526" class="t t-d t-15">和内容的，说好的自动保存呢？这破软件连写的</text><text x="126" y="549" class="t t-d t-15">东西都存不住，简直浪费时间，不玩了！”</text><text x="126" y="578" class="t t-link t-14">看这次使用 →</text><rect x="484" y="463" width="116" height="88" rx="8" class="f-surface s-strong" filter="url(#fx-verdict)"/><rect x="489" y="468" width="106" height="17" rx="4" class="f-hover"/><text x="496" y="480" class="t t-d t-sb t-9">闪念笔记</text><rect x="494" y="493" width="96" height="15" rx="3" class="no-fill s-strong"/><text x="500" y="504" class="t t-s t-9">无标题</text><rect x="494" y="513" width="96" height="19" rx="3" class="no-fill s-strong"/><text x="542" y="545" class="t t-m t-9 t-mid">已自动保存</text><text x="76" y="657" class="t t-d t-15">一打开就要先登录，还没开始记事就觉得麻烦。</text><circle cx="560" cy="652" r="9" class="f-avatar s-card"/><circle cx="573" cy="652" r="9" class="f-avatar s-card"/><circle cx="586" cy="652" r="9" class="f-avatar s-card"/><path d="M604 649l5 5l5 -5" class="s-muted no-fill"/><circle cx="40" cy="206" r="10" class="f-card s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="40" cy="206" r="10" class="f-accent-soft s-accent"/></g><text x="40" y="210.5" class="t t-m t-sb t-13 t-mid t-num">1</text><circle cx="40" cy="347" r="10" class="f-card s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="40" cy="347" r="10" class="f-accent-soft s-accent"/></g><text x="40" y="351.5" class="t t-m t-sb t-13 t-mid t-num">2</text><circle cx="40" cy="472" r="10" class="f-card s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="40" cy="472" r="10" class="f-accent-soft s-accent"/></g><text x="40" y="476.5" class="t t-m t-sb t-13 t-mid t-num">3</text><circle cx="648" cy="202" r="10" class="f-card s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="648" cy="202" r="10" class="f-accent-soft s-accent"/></g><text x="648" y="206.5" class="t t-m t-sb t-13 t-mid t-num">4</text><circle cx="36" cy="735" r="10" class="no-fill s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="36" cy="735" r="10" class="f-accent-soft s-accent"/></g><text x="36" y="739.5" class="t t-m t-sb t-13 t-mid t-num">1</text><text x="56" y="740" class="t t-m t-14">一句话的结论</text><circle cx="264" cy="735" r="10" class="no-fill s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="264" cy="735" r="10" class="f-accent-soft s-accent"/></g><text x="264" y="739.5" class="t t-m t-sb t-13 t-mid t-num">2</text><text x="284" y="740" class="t t-m t-14">每一句都能点开</text><circle cx="492" cy="735" r="10" class="no-fill s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="492" cy="735" r="10" class="f-accent-soft s-accent"/></g><text x="492" y="739.5