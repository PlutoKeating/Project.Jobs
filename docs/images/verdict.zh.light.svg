<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-verdict fig-n4" viewBox="0 0 960 643" width="960" height="643" role="img" aria-label="一页结论的样子（取自一次真实运行）：一句话的结论；每一句都能点开，看到是谁说的、原话和当时的屏幕；人数一律标注为模拟。" xml:lang="zh-CN">
<title>一页结论的样子（取自一次真实运行）：一句话的结论；每一句都能点开，看到是谁说的、原话和当时的屏幕；人数一律标注为模拟。</title>
<style>.fig text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}.fig .t{fill:#26221e;font-size:13px;font-weight:450}.fig .t-d{fill:#16130f}.fig .t-m{fill:#625b53}.fig .t-s{fill:#8d857c}.fig .t-inv{fill:#f7f3ec}.fig .t-link{fill:#4b6560}.fig .t-danger{fill:#9c4b4b}.fig .t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}.fig .t-sb{font-weight:600}.fig .t-b{font-weight:700}.fig .t-mid{text-anchor:middle}.fig .t-end{text-anchor:end}.fig .t-num{font-variant-numeric:tabular-nums}.fig .t-8{font-size:8px}.fig .t-10{font-size:10px}.fig .t-11{font-size:11px}.fig .t-12{font-size:12px}.fig .t-13{font-size:13px}.fig .t-14{font-size:14px}.fig .t-15{font-size:15px}.fig .t-17{font-size:17px}.fig .t-19{font-size:19px}.fig .t-22{font-size:22px}.fig .t-24{font-size:24px;letter-spacing:-0.01em}.fig .t-60{font-size:60px;letter-spacing:-0.03em}.fig .f-bg,.fig .f-card{fill:#f7f3ec}.fig .f-raised{fill:#fbf9f5}.fig .f-surface{fill:#fdfbf8}.fig .f-hover{fill:#f1ece3}.fig .f-fg{fill:#16130f}.fig .f-muted{fill:#625b53}.fig .f-subtle{fill:#8d857c}.fig .f-sage{fill:#5f726d}.fig .f-avatar{fill:#8d857c}.fig .f-accent{fill:#a5623f}.fig .f-accent-soft{fill:rgb(165 98 63 / 0.1)}.fig .f-danger{fill:#9c4b4b}.fig .no-fill{fill:none}.fig .s-line{stroke:rgb(44 38 32 / 0.1)}.fig .s-strong{stroke:rgb(44 38 32 / 0.22)}.fig .s-muted{stroke:#8d857c}.fig .s-fg{stroke:#16130f}.fig .s-sage{stroke:#5f726d}.fig .s-accent{stroke:#a5623f;stroke-width:1.5}.fig .s-danger{stroke:#9c4b4b}.fig .s-card{stroke:#f7f3ec;stroke-width:2}.fig .sw-2{stroke-width:2}.fig .dashed{stroke-dasharray:5 5}.fig .faint{opacity:0.45}.fig path,.fig line{stroke-linecap:round;stroke-linejoin:round}.fig .dot{fill:none;stroke-width:4.6;stroke-linecap:round}.fig .dot-off{stroke:rgb(44 38 32 / 0.22)}.fig .dot-on{stroke:#5f726d}.fig .now{opacity:0}.fig-n3 .now{animation:fig-now-3 7.8s cubic-bezier(0.2,0,0,1) infinite}.fig-n4 .now{animation:fig-now-4 10.4s cubic-bezier(0.2,0,0,1) infinite}.fig-n7 .now{animation:fig-now-7 18.2s cubic-bezier(0.2,0,0,1) infinite}.fig .now-2{animation-delay:2.6s}.fig .now-3{animation-delay:5.2s}.fig .now-4{animation-delay:7.8s}.fig .now-5{animation-delay:10.4s}.fig .now-6{animation-delay:13s}.fig .now-7{animation-delay:15.6s}@keyframes fig-now-3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}@keyframes fig-now-4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@keyframes fig-now-7{0%{opacity:0}1.8%,12.5%{opacity:1}14.28%,100%{opacity:0}}.fig .ripple{opacity:0.5;transform-box:fill-box;transform-origin:center;animation:fig-ripple 2.6s cubic-bezier(0.2,0,0,1) infinite}@keyframes fig-ripple{0%{opacity:0.9;transform:scale(0.4)}70%,100%{opacity:0;transform:scale(1.5)}}.fig .breath{animation:fig-breath 5000ms cubic-bezier(0.45,0,0.55,1) infinite}@keyframes fig-breath{0%,100%{opacity:0.35}50%{opacity:1}}.fig .tw{animation:fig-twinkle 9s cubic-bezier(0.45,0,0.55,1) infinite}.fig .tw-2{animation-delay:-2.2s}.fig .tw-3{animation-delay:-4.6s}.fig .tw-4{animation-delay:-6.9s}@keyframes fig-twinkle{0%,38%,100%{opacity:1}46%,72%{opacity:0.12}80%{opacity:1}}.fig .px-a{fill:#5f726d}.fig .px-b{fill:#3e4f4b}.fig .px-lit{fill:#a5623f}.fig .px-dim{fill:#f7f3ec;opacity:.5}@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}</style>
<defs><clipPath id="fig-card"><rect width="960" height="643" rx="16"/></clipPath></defs>
<g clip-path="url(#fig-card)"><rect width="960" height="643" fill="#f7f3ec"/><rect x="24" y="24" width="912" height="546" rx="18" class="f-bg s-line"/><path d="M648 44L648 550" class="s-line"/><text x="76" y="62" class="t t-d t-b t-17">闪念笔记</text><text x="76" y="82" class="t t-m t-12">想到什么，马上记下，自动保存</text><rect x="76" y="100" width="138" height="30" rx="10" class="f-raised s-line"/><rect x="79" y="103" width="48" height="24" rx="6" class="f-hover"/><text x="103" y="119.5" class="t t-12 t-mid t-d t-sb">结论</text><text x="145" y="119.5" class="t t-12 t-mid t-m">人</text><text x="187" y="119.5" class="t t-12 t-mid t-m">口碑</text><text x="618" y="119.5" class="t t-m t-12 t-end">工程附录</text><text x="76" y="174" class="t t-d t-b t-24">自动保存形同虚设，仅有的 3 个用户全气走了</text><circle cx="81" cy="199.5" r="4" class="f-danger"/><text x="94" y="204" class="t t-13"><tspan class="t-d t-sb">多数人用不下去</tspan><tspan class="t-m"> · 3 人用过</tspan></text><text x="76" y="244" class="t t-d t-b t-14">最让人难受的地方</text><path d="M76 258L618 258" class="s-line"/><text x="76" y="284" class="t t-d t-13">大家写完标题和正文想存下来，看到页面底下写着「已自动保存」</text><text x="76" y="305" class="t t-d t-13">又没有保存按钮，就放心地退回笔记列表，结果标题全变成了</text><text x="76" y="326" class="t t-d t-13">「无标题」，再点进去，刚才打的字空空如也。三个人全都白忙活</text><text x="76" y="347" class="t t-d t-13">一场，直接气走了。</text><circle cx="564" cy="290" r="9" class="f-avatar s-card"/><circle cx="577" cy="290" r="9" class="f-avatar s-card"/><circle cx="590" cy="290" r="9" class="f-avatar s-card"/><path d="M608 292l5 -5l5 5" class="s-muted no-fill"/><circle cx="88" cy="383" r="12" class="f-sage"/><circle cx="88" cy="379" r="4.2" class="f-bg"/><path d="M80.5 392a7.5 7 0 0 1 15 0z" class="f-bg"/><text x="112" y="381" class="t t-13"><tspan class="t-d t-b">周诗涵</tspan><tspan class="t-m"> · 29 岁，带货主播</tspan></text><text x="112" y="405" class="t t-d t-13">“啊？怎么全都是空的！我刚才明明写了标题和内容的，</text><text x="112" y="426" class="t t-d t-13">说好的自动保存呢？这破软件连写的东西都存不住，</text><text x="112" y="447" class="t t-d t-13">简直浪费时间，不玩了！”</text><text x="112" y="474" class="t t-link t-12">看这次使用 →</text><rect x="506" y="369" width="112" height="84" rx="8" class="f-surface s-strong"/><rect x="511" y="374" width="102" height="16" rx="4" class="f-hover"/><text x="518" y="385.5" class="t t-d t-sb t-8">闪念笔记</text><rect x="516" y="398" width="92" height="14" rx="3" class="no-fill s-strong"/><text x="522" y="408" class="t t-s t-8">无标题</text><rect x="516" y="417" width="92" height="18" rx="3" class="no-fill s-strong"/><text x="562" y="447" class="t t-m t-8 t-mid">已自动保存</text><path d="M76 496L618 496" class="s-line"/><text x="76" y="522" class="t t-d t-13">一打开就要先登录，还没开始记事就觉得麻烦。</text><circle cx="564" cy="518" r="9" class="f-avatar s-card"/><circle cx="577" cy="518" r="9" class="f-avatar s-card"/><circle cx="590" cy="518" r="9" class="f-avatar s-card"/><path d="M608 515l5 5l5 -5" class="s-muted no-fill"/><path d="M76 544L618 544" class="s-line"/><text x="676" y="62" class="t t-d t-b t-14">人数</text><rect x="714" y="48" width="62" height="20" rx="10" class="no-fill s-strong"/><text x="745" y="62" class="t t-m t-11 t-mid">模拟估计</text><text x="676" y="98" class="t t-m t-12">看到</text><rect x="738" y="89" width="130" height="10" rx="5" class="f-sage"/><text x="908" y="98" class="t t-b t-14 t-end t-num t-d">194</text><text x="676" y="128" class="t t-m t-12">注意到</text><rect x="738" y="119" width="103.87" height="10" rx="5" class="f-sage"/><text x="908" y="128" class="t t-b t-14 t-end t-num t-d">155</text><text x="676" y="158" class="t t-m t-12">有兴趣</text><rect x="738" y="149" width="2.68" height="10" rx="5" class="f-sage"/><text x="908" y="158" class="t t-b t-14 t-end t-num t-d">4</text><text x="676" y="188" class="t t-m t-12">打开过</text><rect x="738" y="179" width="2.68" height="10" rx="5" class="f-sage"/><text x="908" y="188" class="t t-b t-14 t-end t-num t-d">4</text><text x="676" y="218" class="t t-m t-12">回来再用</text><text x="908" y="218" class="t t-b t-14 t-end t-num t-s">0</text><path d="M676 240L908 240" class="s-line"/><text x="676" y="268" class="t t-d t-b t-13">宣发强度</text><text x="908" y="268" class="t t-d t-13 t-end t-num">90%</text><path d="M676 290L908 290" class="s-strong"/><path d="M676 290H884.8" class="s-fg sw-2"/><circle cx="884.8" cy="290" r="7" class="f-fg s-card sw-2"/><path d="M676 316L908 316" class="s-line"/><text x="676" y="344" class="t t-d t-b t-13">把手机递给几个人</text><rect x="676" y="358" width="84" height="32" rx="10" class="f-raised s-line"/><text x="692" y="379" class="t t-m t-14 t-mid">−</text><text x="718" y="379" class="t t-d t-13 t-mid t-num">3</text><text x="744" y="379" class="t t-m t-14 t-mid">+</text><rect x="770" y="358" width="138" height="32" rx="10" class="no-fill s-strong"/><text x="839" y="379" class="t t-d t-sb t-13 t-mid">递过去</text><circle cx="48" cy="166" r="9" class="f-card s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="48" cy="166" r="9" class="f-accent-soft s-accent"/></g><text x="48" y="170" class="t t-m t-sb t-11 t-mid t-num">1</text><circle cx="48" cy="280" r="9" class="f-card s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="48" cy="280" r="9" class="f-accent-soft s-accent"/></g><text x="48" y="284" class="t t-m t-sb t-11 t-mid t-num">2</text><circle cx="48" cy="377" r="9" class="f-card s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="48" cy="377" r="9" class="f-accent-soft s-accent"/></g><text x="48" y="381" class="t t-m t-sb t-11 t-mid t-num">3</text><circle cx="654" cy="57" r="9" class="f-card s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="654" cy="57" r="9" class="f-accent-soft s-accent"/></g><text x="654" y="61" class="t t-m t-sb t-11 t-mid t-num">4</text><circle cx="36" cy="600" r="9" class="no-fill s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="36" cy="600" r="9" class="f-accent-soft s-accent"/></g><text x="36" y="604" class="t t-m t-sb t-11 t-mid t-num">1</text><text x="54" y="604" class="t t-m t-12">一句话的结论</text><circle cx="264" cy="600" r="9" class="no-fill s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="264" cy="600" r="9" class="f-accent-soft s-accent"/></g><text x="264" y="604" class="t t-m t-sb t-11 t-mid t-num">2</text><text x="282" y="604" class="t t-m t-12">每一句都能点开</text><circle cx="492" cy="600" r="9" class="no-fill s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="492" cy="600" r="9" class="f-accent-soft s-accent"/></g><text x="492" y="604" class="t t-m t-sb t-11 t-mid t-num">3</text><text x="510" y="604" class="t t-m t-12">谁说的、原话、</text><text x="510" y="621" class="t t-m t-12">当时的屏幕</text><circle cx="720" cy="600" r="9" class="no-fill s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="720" cy="600" r="9" class="f-accent-soft s-accent"/></g><text x="720" y="604" class="t t-m t-sb t-11 t-mid t-num">4</text><text x="738" y="604" class="t t-m t-12">人数一律标注</text><text x="738" y="621" class="t t-m t-12">「模拟」</text></g>
