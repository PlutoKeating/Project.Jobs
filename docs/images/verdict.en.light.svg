<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-verdict fig-n4" viewBox="0 0 960 675" width="960" height="675" role="img" aria-label="What the one-page conclusion looks like (from a real run, translated from Chinese): a one-line verdict; every sentence opens to who said it, their words and the screen at that moment; head counts are always labelled as simulated." xml:lang="en">
<title>What the one-page conclusion looks like (from a real run, translated from Chinese): a one-line verdict; every sentence opens to who said it, their words and the screen at that moment; head counts are always labelled as simulated.</title>
<style>.fig text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}.fig .t{fill:#26221e;font-size:13px;font-weight:450}.fig .t-d{fill:#16130f}.fig .t-m{fill:#625b53}.fig .t-s{fill:#8d857c}.fig .t-inv{fill:#f7f3ec}.fig .t-link{fill:#4b6560}.fig .t-danger{fill:#9c4b4b}.fig .t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}.fig .t-sb{font-weight:600}.fig .t-b{font-weight:700}.fig .t-mid{text-anchor:middle}.fig .t-end{text-anchor:end}.fig .t-num{font-variant-numeric:tabular-nums}.fig .t-8{font-size:8px}.fig .t-10{font-size:10px}.fig .t-11{font-size:11px}.fig .t-12{font-size:12px}.fig .t-13{font-size:13px}.fig .t-14{font-size:14px}.fig .t-15{font-size:15px}.fig .t-17{font-size:17px}.fig .t-19{font-size:19px}.fig .t-22{font-size:22px}.fig .t-24{font-size:24px;letter-spacing:-0.01em}.fig .t-60{font-size:60px;letter-spacing:-0.03em}.fig .f-bg,.fig .f-card{fill:#f7f3ec}.fig .f-raised{fill:#fbf9f5}.fig .f-surface{fill:#fdfbf8}.fig .f-hover{fill:#f1ece3}.fig .f-fg{fill:#16130f}.fig .f-muted{fill:#625b53}.fig .f-subtle{fill:#8d857c}.fig .f-sage{fill:#5f726d}.fig .f-avatar{fill:#8d857c}.fig .f-accent{fill:#a5623f}.fig .f-accent-soft{fill:rgb(165 98 63 / 0.1)}.fig .f-danger{fill:#9c4b4b}.fig .no-fill{fill:none}.fig .s-line{stroke:rgb(44 38 32 / 0.1)}.fig .s-strong{stroke:rgb(44 38 32 / 0.22)}.fig .s-muted{stroke:#8d857c}.fig .s-fg{stroke:#16130f}.fig .s-sage{stroke:#5f726d}.fig .s-accent{stroke:#a5623f;stroke-width:1.5}.fig .s-danger{stroke:#9c4b4b}.fig .s-card{stroke:#f7f3ec;stroke-width:2}.fig .sw-2{stroke-width:2}.fig .dashed{stroke-dasharray:5 5}.fig .faint{opacity:0.45}.fig path,.fig line{stroke-linecap:round;stroke-linejoin:round}.fig .dot{fill:none;stroke-width:4.6;stroke-linecap:round}.fig .dot-off{stroke:rgb(44 38 32 / 0.22)}.fig .dot-on{stroke:#5f726d}.fig .now{opacity:0}.fig-n3 .now{animation:fig-now-3 7.8s cubic-bezier(0.2,0,0,1) infinite}.fig-n4 .now{animation:fig-now-4 10.4s cubic-bezier(0.2,0,0,1) infinite}.fig-n7 .now{animation:fig-now-7 18.2s cubic-bezier(0.2,0,0,1) infinite}.fig .now-2{animation-delay:2.6s}.fig .now-3{animation-delay:5.2s}.fig .now-4{animation-delay:7.8s}.fig .now-5{animation-delay:10.4s}.fig .now-6{animation-delay:13s}.fig .now-7{animation-delay:15.6s}@keyframes fig-now-3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}@keyframes fig-now-4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@keyframes fig-now-7{0%{opacity:0}1.8%,12.5%{opacity:1}14.28%,100%{opacity:0}}.fig .ripple{opacity:0.5;transform-box:fill-box;transform-origin:center;animation:fig-ripple 2.6s cubic-bezier(0.2,0,0,1) infinite}@keyframes fig-ripple{0%{opacity:0.9;transform:scale(0.4)}70%,100%{opacity:0;transform:scale(1.5)}}.fig .breath{animation:fig-breath 5000ms cubic-bezier(0.45,0,0.55,1) infinite}@keyframes fig-breath{0%,100%{opacity:0.35}50%{opacity:1}}.fig .tw{animation:fig-twinkle 9s cubic-bezier(0.45,0,0.55,1) infinite}.fig .tw-2{animation-delay:-2.2s}.fig .tw-3{animation-delay:-4.6s}.fig .tw-4{animation-delay:-6.9s}@keyframes fig-twinkle{0%,38%,100%{opacity:1}46%,72%{opacity:0.12}80%{opacity:1}}.fig .px-a{fill:#5f726d}.fig .px-b{fill:#3e4f4b}.fig .px-lit{fill:#a5623f}.fig .px-dim{fill:#f7f3ec;opacity:.5}@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}</style>
<defs><clipPath id="fig-card"><rect width="960" height="675" rx="16"/></clipPath></defs>
<g clip-path="url(#fig-card)"><rect width="960" height="675" fill="#f7f3ec"/><rect x="24" y="24" width="912" height="578" rx="18" class="f-bg s-line"/><path d="M648 44L648 582" class="s-line"/><text x="76" y="62" class="t t-d t-b t-17">闪念笔记 (Quick Notes)</text><text x="76" y="82" class="t t-m t-12">Write it down the moment you think of it. Saves automatically.</text><rect x="76" y="100" width="253" height="30" rx="10" class="f-raised s-line"/><rect x="79" y="103" width="70" height="24" rx="6" class="f-hover"/><text x="114" y="119.5" class="t t-12 t-mid t-d t-sb">Verdict</text><text x="180.5" y="119.5" class="t t-12 t-mid t-m">People</text><text x="269" y="119.5" class="t t-12 t-mid t-m">Word of mouth</text><text x="618" y="119.5" class="t t-m t-12 t-end">Engineering</text><text x="76" y="174" class="t t-d t-b t-24">Auto-save saved nothing.</text><text x="76" y="206" class="t t-d t-b t-24">All three who tried it left.</text><circle cx="81" cy="231.5" r="4" class="f-danger"/><text x="94" y="236" class="t t-13"><tspan class="t-d t-sb">Most people give up</tspan><tspan class="t-m"> · 3 used it</tspan></text><text x="76" y="276" class="t t-d t-b t-14">What hurt most</text><path d="M76 290L618 290" class="s-line"/><text x="76" y="316" class="t t-d t-13">They wrote a title and a note, saw “Auto-saved” at the bottom and</text><text x="76" y="337" class="t t-d t-13">no save button, and went back to the list. Every title now read</text><text x="76" y="358" class="t t-d t-13">“Untitled”, and the note they had just typed was empty. All three</text><text x="76" y="379" class="t t-d t-13">had wasted their effort and left.</text><circle cx="564" cy="322" r="9" class="f-avatar s-card"/><circle cx="577" cy="322" r="9" class="f-avatar s-card"/><circle cx="590" cy="322" r="9" class="f-avatar s-card"/><path d="M608 324l5 -5l5 5" class="s-muted no-fill"/><circle cx="88" cy="415" r="12" class="f-sage"/><circle cx="88" cy="411" r="4.2" class="f-bg"/><path d="M80.5 424a7.5 7 0 0 1 15 0z" class="f-bg"/><text x="112" y="413" class="t t-13"><tspan class="t-d t-b">Zhou Shihan</tspan><tspan class="t-m"> · 29, livestream seller</tspan></text><text x="112" y="437" class="t t-d t-13">“What? It’s all empty! I wrote a title and the text just</text><text x="112" y="458" class="t t-d t-13">now. What happened to auto-save? This thing can’t even</text><text x="112" y="479" class="t t-d t-13">keep what I type. What a waste of time. I’m done!”</text><text x="112" y="506" class="t t-link t-12">Open session →</text><rect x="506" y="401" width="112" height="84" rx="8" class="f-surface s-strong"/><rect x="511" y="406" width="102" height="16" rx="4" class="f-hover"/><text x="518" y="417.5" class="t t-d t-sb t-8">闪念笔记</text><rect x="516" y="430" width="92" height="14" rx="3" class="no-fill s-strong"/><text x="522" y="440" class="t t-s t-8">无标题</text><rect x="516" y="449" width="92" height="18" rx="3" class="no-fill s-strong"/><text x="562" y="479" class="t t-m t-8 t-mid">已自动保存</text><path d="M76 528L618 528" class="s-line"/><text x="76" y="554" class="t t-d t-13">It asks you to log in before you can write anything.</text><circle cx="564" cy="550" r="9" class="f-avatar s-card"/><circle cx="577" cy="550" r="9" class="f-avatar s-card"/><circle cx="590" cy="550" r="9" class="f-avatar s-card"/><path d="M608 547l5 5l5 -5" class="s-muted no-fill"/><path d="M76 576L618 576" class="s-line"/><text x="676" y="62" class="t t-d t-b t-14">People</text><rect x="731.08" y="48" width="73" height="20" rx="10" class="no-fill s-strong"/><text x="767.58" y="62" class="t t-m t-11 t-mid">Simulated</text><text x="676" y="98" class="t t-m t-12">Saw it</text><rect x="758.4" y="89" width="109.6" height="10" rx="5" class="f-sage"/><text x="908" y="98" class="t t-b t-14 t-end t-num t-d">194</text><text x="676" y="128" class="t t-m t-12">Noticed</text><rect x="758.4" y="119" width="87.57" height="10" rx="5" class="f-sage"/><text x="908" y="128" class="t t-b t-14 t-end t-num t-d">155</text><text x="676" y="158" class="t t-m t-12">Interested</text><rect x="758.4" y="149" width="2.26" height="10" rx="5" class="f-sage"/><text x="908" y="158" class="t t-b t-14 t-end t-num t-d">4</text><text x="676" y="188" class="t t-m t-12">Opened</text><rect x="758.4" y="179" width="2.26" height="10" rx="5" class="f-sage"/><text x="908" y="188" class="t t-b t-14 t-end t-num t-d">4</text><text x="676" y="218" class="t t-m t-12">Came back</text><text x="908" y="218" class="t t-b t-14 t-end t-num t-s">0</text><path d="M676 240L908 240" class="s-line"/><text x="676" y="268" class="t t-d t-b t-13">Promotion</text><text x="908" y="268" class="t t-d t-13 t-end t-num">90%</text><path d="M676 290L908 290" class="s-strong"/><path d="M676 290H884.8" class="s-fg sw-2"/><circle cx="884.8" cy="290" r="7" class="f-fg s-card sw-2"/><path d="M676 316L908 316" class="s-line"/><text x="676" y="344" class="t t-d t-b t-13">Hand it to a few people</text><rect x="676" y="358" width="84" height="32" rx="10" class="f-raised s-line"/><text x="692" y="379" class="t t-m t-14 t-mid">−</text><text x="718" y="379" class="t t-d t-13 t-mid t-num">3</text><text x="744" y="379" class="t t-m t-14 t-mid">+</text><rect x="770" y="358" width="138" height="32" rx="10" class="no-fill s-strong"/><text x="839" y="379" class="t t-d t-sb t-13 t-mid">Hand it over</text><circle cx="48" cy="166" r="9" class="f-card s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="48" cy="166" r="9" class="f-accent-soft s-accent"/></g><text x="48" y="170" class="t t-m t-sb t-11 t-mid t-num">1</text><circle cx="48" cy="312" r="9" class="f-card s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="48" cy="312" r="9" class="f-accent-soft s-accent"/></g><text x="48" y="316" class="t t-m t-sb t-11 t-mid t-num">2</text><circle cx="48" cy="409" r="9" class="f-card s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="48" cy="409" r="9" class="f-accent-soft s-accent"/></g><text x="48" y="413" class="t t-m t-sb t-11 t-mid t-num">3</text><circle cx="654" cy="57" r="9" class="f-card s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="654" cy="57" r="9" class="f-accent-soft s-accent"/></g><text x="654" y="61" class="t t-m t-sb t-11 t-mid t-num">4</text><circle cx="36" cy="632" r="9" class="no-fill s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="36" cy="632" r="9" class="f-accent-soft s-accent"/></g><text x="36" y="636" class="t t-m t-sb t-11 t-mid t-num">1</text><text x="54" y="636" class="t t-m t-12">A one-line verdict</text><circle cx="264" cy="632" r="9" class="no-fill s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="264" cy="632" r="9" class="f-accent-soft s-accent"/></g><text x="264" y="636" class="t t-m t-sb t-11 t-mid t-num">2</text><text x="282" y="636" class="t t-m t-12">Every sentence opens</text><circle cx="492" cy="632" r="9" class="no-fill s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="492" cy="632" r="9" class="f-accent-soft s-accent"/></g><text x="492" y="636" class="t t-m t-sb t-11 t-mid t-num">3</text><text x="510" y="636" class="t t-m t-12">Who said it, their words,</text><text x="510" y="653" class="t t-m t-12">the screen at that moment</text><circle cx="720" cy="632" r="9" class="no-fill s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="720" cy="632" r="9" class="f-accent-soft s-accent"/></g><text x="720" y="636" class="t t-m t-sb t-11 t-mid t-num">4</text><text x="738" y="636" class="t t-m t-12">Head counts are always</text><text x="738" y="653" class="t t-m t-12">labelled “simulated”</text></g>
<rect x="0.5" y="0.5" width="959" height="674" rx="15.5" fill="none" stroke="rgb(44 38 32 / 0.22)"/>
