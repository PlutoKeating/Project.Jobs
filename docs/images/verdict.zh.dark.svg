<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-verdict fig-n4" viewBox="0 0 960 686" width="960" height="686" role="img" aria-label="一页结论的样子（取自一次真实运行）：一句话的结论；每一句都能点开，看到是谁说的、原话和当时的屏幕；人数一律标注为模拟。" xml:lang="zh-CN">
<title>一页结论的样子（取自一次真实运行）：一句话的结论；每一句都能点开，看到是谁说的、原话和当时的屏幕；人数一律标注为模拟。</title>
<style>.fig text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif}.fig .t{fill:#e8e4dd;font-size:13px;font-weight:450}.fig .t-d{fill:#e8e4dd}.fig .t-m{fill:#a9a49c}.fig .t-s{fill:#6f6b65}.fig .t-inv{fill:#0e0f11}.fig .t-link{fill:#cfd8d5}.fig .t-danger{fill:#c97c7c}.fig .t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK SC",monospace}.fig .t-sb{font-weight:600}.fig .t-b{font-weight:700}.fig .t-mid{text-anchor:middle}.fig .t-end{text-anchor:end}.fig .t-num{font-variant-numeric:tabular-nums}.fig .t-9{font-size:9px}.fig .t-11{font-size:11px}.fig .t-12{font-size:12px}.fig .t-13{font-size:13px}.fig .t-14{font-size:14px}.fig .t-15{font-size:15px}.fig .t-16{font-size:16px}.fig .t-19{font-size:19px}.fig .t-24{font-size:24px;letter-spacing:-0.01em}.fig .t-60{font-size:60px;letter-spacing:-0.03em}.fig .f-bg,.fig .f-card{fill:#0e0f11}.fig .f-raised{fill:#131417}.fig .f-surface{fill:#17181c}.fig .f-hover{fill:#1d1e23}.fig .f-fg{fill:#e8e4dd}.fig .f-muted{fill:#a9a49c}.fig .f-subtle{fill:#6f6b65}.fig .f-sage{fill:#7d8f8a}.fig .f-avatar{fill:#6f6b65}.fig .f-accent{fill:#f0a35e}.fig .f-accent-soft{fill:rgb(240 163 94 / 0.12)}.fig .f-danger{fill:#c97c7c}.fig .no-fill{fill:none}.fig .s-line{stroke:rgb(232 228 221 / 0.08)}.fig .s-strong{stroke:rgb(232 228 221 / 0.18)}.fig .s-muted{stroke:#6f6b65}.fig .s-fg{stroke:#e8e4dd}.fig .s-sage{stroke:#7d8f8a}.fig .s-accent{stroke:#f0a35e;stroke-width:1.5}.fig .s-danger{stroke:#c97c7c}.fig .s-card{stroke:#0e0f11;stroke-width:2}.fig .sw-2{stroke-width:2}.fig .dashed{stroke-dasharray:5 5}.fig .faint{opacity:0.45}.fig path,.fig line{stroke-linecap:round;stroke-linejoin:round}.fig .dot{fill:none;stroke-width:4.6;stroke-linecap:round}.fig .dot-off{stroke:rgb(232 228 221 / 0.18)}.fig .dot-on{stroke:#7d8f8a}.fig .now{opacity:0}.fig-n3 .now{animation:fig-now-3 7.8s cubic-bezier(0.2,0,0,1) infinite}.fig-n4 .now{animation:fig-now-4 10.4s cubic-bezier(0.2,0,0,1) infinite}.fig-n7 .now{animation:fig-now-7 18.2s cubic-bezier(0.2,0,0,1) infinite}.fig .now-2{animation-delay:2.6s}.fig .now-3{animation-delay:5.2s}.fig .now-4{animation-delay:7.8s}.fig .now-5{animation-delay:10.4s}.fig .now-6{animation-delay:13s}.fig .now-7{animation-delay:15.6s}@keyframes fig-now-3{0%{opacity:0}4%,29%{opacity:1}33.3%,100%{opacity:0}}@keyframes fig-now-4{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@keyframes fig-now-7{0%{opacity:0}1.8%,12.5%{opacity:1}14.28%,100%{opacity:0}}.fig .ripple{opacity:0.5;transform-box:fill-box;transform-origin:center;animation:fig-ripple 2.6s cubic-bezier(0.2,0,0,1) infinite}@keyframes fig-ripple{0%{opacity:0.9;transform:scale(0.4)}70%,100%{opacity:0;transform:scale(1.5)}}.fig .breath{animation:fig-breath 5000ms cubic-bezier(0.45,0,0.55,1) infinite}@keyframes fig-breath{0%,100%{opacity:0.35}50%{opacity:1}}.fig .tw{animation:fig-twinkle 9s cubic-bezier(0.45,0,0.55,1) infinite}.fig .tw-2{animation-delay:-2.2s}.fig .tw-3{animation-delay:-4.6s}.fig .tw-4{animation-delay:-6.9s}@keyframes fig-twinkle{0%,38%,100%{opacity:1}46%,72%{opacity:0.12}80%{opacity:1}}.fig .px-a{fill:#7d8f8a}.fig .px-b{fill:#c2cfcb}.fig .px-lit{fill:#f0a35e}.fig .px-dim{fill:#0e0f11;opacity:.5}@media (prefers-reduced-motion:reduce){.fig *{animation:none!important}}</style>
<defs><clipPath id="fig-card"><rect width="960" height="686" rx="16"/></clipPath></defs>
<g clip-path="url(#fig-card)"><rect width="960" height="686" fill="#0e0f11"/><rect x="24" y="24" width="912" height="585" rx="18" class="f-bg s-line"/><path d="M648 44L648 589" class="s-line"/><text x="76" y="62" class="t t-d t-b t-19">闪念笔记</text><text x="76" y="84" class="t t-m t-14">想到什么，马上记下，自动保存</text><rect x="76" y="102" width="154" height="34" rx="10" class="f-raised s-line"/><rect x="79" y="105" width="54" height="28" rx="7" class="f-hover"/><text x="106" y="124" class="t t-14 t-mid t-d t-sb">结论</text><text x="153" y="124" class="t t-14 t-mid t-m">人</text><text x="200" y="124" class="t t-14 t-mid t-m">口碑</text><text x="618" y="124" class="t t-m t-14 t-end">工程附录</text><text x="76" y="182" class="t t-d t-b t-24">自动保存形同虚设，仅有的 3 个用户全气走了</text><circle cx="81" cy="209" r="4.5" class="f-danger"/><text x="95" y="214" class="t t-15"><tspan class="t-d t-sb">多数人用不下去</tspan><tspan class="t-m"> · 3 人用过</tspan></text><text x="76" y="256" class="t t-d t-b t-16">最让人难受的地方</text><path d="M76 271L618 271" class="s-line"/><text x="76" y="300" class="t t-d t-15">大家写完标题和正文想存下来，看到页面底下写着「已自动保存」</text><text x="76" y="323" class="t t-d t-15">又没有保存按钮，就放心地退回笔记列表，结果标题全变成了</text><text x="76" y="346" class="t t-d t-15">「无标题」，再点进去，刚才打的字空空如也。三个人全都白忙活</text><text x="76" y="369" class="t t-d t-15">一场，直接气走了。</text><circle cx="564" cy="306" r="9" class="f-avatar s-card"/><circle cx="577" cy="306" r="9" class="f-avatar s-card"/><circle cx="590" cy="306" r="9" class="f-avatar s-card"/><path d="M608 308l5 -5l5 5" class="s-muted no-fill"/><circle cx="88" cy="408" r="12" class="f-sage"/><circle cx="88" cy="404" r="4.2" class="f-bg"/><path d="M80.5 417a7.5 7 0 0 1 15 0z" class="f-bg"/><text x="112" y="407" class="t t-15"><tspan class="t-d t-b">周诗涵</tspan><tspan class="t-m"> · 29 岁，带货主播</tspan></text><text x="112" y="433" class="t t-d t-15">“啊？怎么全都是空的！我刚才明明写了标题</text><text x="112" y="456" class="t t-d t-15">和内容的，说好的自动保存呢？这破软件连写的</text><text x="112" y="479" class="t t-d t-15">东西都存不住，简直浪费时间，不玩了！”</text><text x="112" y="508" class="t t-link t-14">看这次使用 →</text><rect x="502" y="393" width="116" height="88" rx="8" class="f-surface s-strong"/><rect x="507" y="398" width="106" height="17" rx="4" class="f-hover"/><text x="514" y="410" class="t t-d t-sb t-9">闪念笔记</text><rect x="512" y="423" width="96" height="15" rx="3" class="no-fill s-strong"/><text x="518" y="434" class="t t-s t-9">无标题</text><rect x="512" y="443" width="96" height="19" rx="3" class="no-fill s-strong"/><text x="560" y="475" class="t t-m t-9 t-mid">已自动保存</text><path d="M76 532L618 532" class="s-line"/><text x="76" y="560" class="t t-d t-15">一打开就要先登录，还没开始记事就觉得麻烦。</text><circle cx="564" cy="555" r="9" class="f-avatar s-card"/><circle cx="577" cy="555" r="9" class="f-avatar s-card"/><circle cx="590" cy="555" r="9" class="f-avatar s-card"/><path d="M608 552l5 5l5 -5" class="s-muted no-fill"/><path d="M76 583L618 583" class="s-line"/><text x="676" y="63" class="t t-d t-b t-16">人数</text><rect x="720" y="46" width="72" height="24" rx="12" class="no-fill s-strong"/><text x="756" y="62.5" class="t t-m t-13 t-mid">模拟估计</text><text x="676" y="104" class="t t-m t-14">看到</text><rect x="748" y="94" width="114" height="11" rx="5.5" class="f-sage"/><text x="908" y="104" class="t t-b t-16 t-end t-num t-d">194</text><text x="676" y="136" class="t t-m t-14">注意到</text><rect x="748" y="126" width="91.08" height="11" rx="5.5" class="f-sage"/><text x="908" y="136" class="t t-b t-16 t-end t-num t-d">155</text><text x="676" y="168" class="t t-m t-14">有兴趣</text><rect x="748" y="158" width="2.35" height="11" rx="5.5" class="f-sage"/><text x="908" y="168" class="t t-b t-16 t-end t-num t-d">4</text><text x="676" y="200" class="t t-m t-14">打开过</text><rect x="748" y="190" width="2.35" height="11" rx="5.5" class="f-sage"/><text x="908" y="200" class="t t-b t-16 t-end t-num t-d">4</text><text x="676" y="232" class="t t-m t-14">回来再用</text><text x="908" y="232" class="t t-b t-16 t-end t-num t-s">0</text><path d="M676 254L908 254" class="s-line"/><text x="676" y="284" class="t t-d t-b t-15">宣发强度</text><text x="908" y="284" class="t t-d t-15 t-end t-num">90%</text><path d="M676 308L908 308" class="s-strong"/><path d="M676 308H884.8" class="s-fg sw-2"/><circle cx="884.8" cy="308" r="7" class="f-fg s-card sw-2"/><path d="M676 336L908 336" class="s-line"/><text x="676" y="366" class="t t-d t-b t-15">把手机递给几个人</text><rect x="676" y="382" width="88" height="36" rx="10" class="f-raised s-line"/><text x="693" y="405.5" class="t t-m t-16 t-mid">−</text><text x="720" y="405" class="t t-d t-15 t-mid t-num">3</text><text x="747" y="405.5" class="t t-m t-16 t-mid">+</text><rect x="774" y="382" width="134" height="36" rx="10" class="no-fill s-strong"/><text x="841" y="405" class="t t-d t-sb t-15 t-mid">递过去</text><circle cx="48" cy="174" r="10" class="f-card s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="48" cy="174" r="10" class="f-accent-soft s-accent"/></g><text x="48" y="178.5" class="t t-m t-sb t-13 t-mid t-num">1</text><circle cx="48" cy="295" r="10" class="f-card s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="48" cy="295" r="10" class="f-accent-soft s-accent"/></g><text x="48" y="299.5" class="t t-m t-sb t-13 t-mid t-num">2</text><circle cx="48" cy="402" r="10" class="f-card s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="48" cy="402" r="10" class="f-accent-soft s-accent"/></g><text x="48" y="406.5" class="t t-m t-sb t-13 t-mid t-num">3</text><circle cx="654" cy="57" r="10" class="f-card s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="654" cy="57" r="10" class="f-accent-soft s-accent"/></g><text x="654" y="61.5" class="t t-m t-sb t-13 t-mid t-num">4</text><circle cx="36" cy="640" r="10" class="no-fill s-sage"/><g class="now now-1" aria-hidden="true"><circle cx="36" cy="640" r="10" class="f-accent-soft s-accent"/></g><text x="36" y="644.5" class="t t-m t-sb t-13 t-mid t-num">1</text><text x="56" y="645" class="t t-m t-14">一句话的结论</text><circle cx="264" cy="640" r="10" class="no-fill s-sage"/><g class="now now-2" aria-hidden="true"><circle cx="264" cy="640" r="10" class="f-accent-soft s-accent"/></g><text x="264" y="644.5" class="t t-m t-sb t-13 t-mid t-num">2</text><text x="284" y="645" class="t t-m t-14">每一句都能点开</text><circle cx="492" cy="640" r="10" class="no-fill s-sage"/><g class="now now-3" aria-hidden="true"><circle cx="492" cy="640" r="10" class="f-accent-soft s-accent"/></g><text x="492" y="644.5" class="t t-m t-sb t-13 t-mid t-num">3</text><text x="512" y="645" class="t t-m t-14">谁说的、原话、</text><text x="512" y="664" class="t t-m t-14">当时的屏幕</text><circle cx="720" cy="640" r="10" class="no-fill s-sage"/><g class="now now-4" aria-hidden="true"><circle cx="720" cy="640" r="10" class="f-accent-soft s-accent"/></g><text x="720" y="644.5" class="t t-m t-sb t-13 t-mid t-num">4</text><text x="740" y="645" class="t t-m t-14">人数一律标注</text><text x="740" y="664" class="t t-m t-14">「模拟」</text></g>
