xt x="578" y="206" class="t t-m t-12 t-end">HTTP → 接口 · Terraria → 游戏服</text><rect x="60" y="232" width="261" height="88" rx="10" class="f-surface s-line"/><text x="76" y="259" class="t t-d t-b t-13">接口与网页</text><text x="76" y="281" class="t t-m t-12">REST · WebSocket 实时推送</text><text x="76" y="299" class="t t-m t-12">飞书机器人</text><rect x="333" y="232" width="261" height="88" rx="10" class="f-surface s-line"/><text x="349" y="259" class="t t-d t-b t-13">世界服务</text><text x="349" y="281" class="t t-m t-12">常驻运行：时钟、日程、需求、位置</text><text x="349" y="299" class="t t-m t-12">发布引擎：遇到 → 决定 → 使用 → 口碑</text><circle cx="574" cy="254" r="4" class="f-accent breath"/><rect x="60" y="332" width="261" height="88" rx="10" class="f-surface s-line"/><text x="76" y="359" class="t t-d t-b t-13">使用过程</text><text x="76" y="381" class="t t-m t-12">每次使用一个独立的 Chromium</text><text x="76" y="399" class="t t-m t-12">看截图定位 · 人的手 · 录像</text><rect x="333" y="332" width="261" height="88" rx="10" class="f-surface s-line"/><text x="349" y="359" class="t t-d t-b t-13">模型路由</text><text x="349" y="381" class="t t-m t-12">每一步 · 归纳 · 定位 · 向量 · 画图</text><text x="349" y="399" class="t t-m t-12">多家供应商，失败接替，记下花费</text><rect x="630" y="142" width="286" height="296" rx="14" class="f-raised s-line"/><text x="648" y="168" class="t t-d t-sb t-12">标准镜像</text><rect x="646" y="182" width="254" height="52.5" rx="10" class="f-surface s-line"/><text x="662" y="205.25" class="t t-d t-b t-13">Postgres + pgvector</text><text x="662" y="223.25" class="t t-m t-11">居民、记忆、发布</text><rect x="646" y="244.5" width="254" height="52.5" rx="10" class="f-surface s-line"/><text x="662" y="267.75" class="t t-d t-b t-13">MinIO</text><text x="662" y="285.75" class="t t-m t-11">截图、录像等证据</text><rect x="646" y="307" width="254" height="52.5" rx="10" class="f-surface s-line"/><text x="662" y="330.25" class="t t-d t-b t-13">NATS</text><text x="662" y="348.25" class="t t-m t-11">事件总线</text><rect x="646" y="369.5" width="254" height="52.5" rx="10" class="f-surface s-line dashed"/><text x="662" y="392.75" class="t t-d t-b t-13">Terraria 游戏服（可选）</text><text x="662" y="410.75" class="t t-m t-11">TShock · tModLoader</text><path d="M612 290h16" class="s-strong no-fill"/><path d="M190.5 424L190.5 488M186.5 484L190.5 488L194.5 484" class="s-strong no-fill"/><path d="M463.5 424L463.5 488M459.5 484L463.5 488L467.5 484" class="s-strong no-fill"/><rect x="60" y="492" width="261" height="82" rx="10" class="no-fill s-strong"/><text x="76" y="519" class="t t-d t-b t-13">你的产品</text><text x="76" y="540" class="t t-m t-12">这台机器访问得到的任何网址，</text><text x="76" y="558" class="t t-m t-12">本机的开发服务器也行</text><rect x="333" y="492" width="261" height="82" rx="10" class="no-fill s-strong"/><text x="349" y="519" class="t t-d t-b t-13">你接入的模型供应商</text><text x="349" y="540" class="t t-m t-12">在网页的「模型」里配置，</text><text x="349" y="558" class="t t-m t-12">保存后几秒生效</text><text x="646" y="519" class="t t-m t-12">居民、记忆、截图和结论都存在</text><text x="646" y="537" class="t t-m t-12">你机器上的 Docker 卷里。</text></g>
