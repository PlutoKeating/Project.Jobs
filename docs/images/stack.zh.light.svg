<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-stack" viewBox="0 0 960 598" width="960" height="598" role="img" aria-label="Jobs 的结构：网页、命令行、coding agent、飞书、Terraria 是同一套能力的五个入口；我们自己的代码在一个镜像里（单端口网关、接口与网页、世界服务、使用过程、模型路由），旁边是标准镜像（Postgres、MinIO、NATS、可选的游戏服）；全部跑在你自己的机器上，只向外访问你的产品和你接入的模型供应商。" xml:lang="zh-CN">
<title>Jobs 的结构：网页、命令行、coding agent、飞书、Terraria 是同一套能力的五个入口；我们自己的代码在一个镜像里（单端口网关、接口与网页、世界服务、使用过程、模型路由），旁边是标准镜像（Postgres、MinIO、NATS、可选的游戏服）；全部跑在你自己的机器上，只向外访问你的产品和你接入的模型供应商。</title>
