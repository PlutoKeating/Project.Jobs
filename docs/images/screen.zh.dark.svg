<svg xmlns="http://www.w3.org/2000/svg" class="fig fig-screen fig-n3" viewBox="0 0 960 452" width="960" height="452" role="img" aria-label="居民怎么用产品：他只看得到截图，超出阅读预算或看不清的地方是模糊的；他说出心里的话和手上的一个动作；屏幕上有看得见的变化才算做成。页面结构、元素列表、接口与脚本错误都不会交给他，他也不知道这是一次测试。" xml:lang="zh-CN">
