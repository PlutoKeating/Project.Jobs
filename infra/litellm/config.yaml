# LiteLLM 角色别名网关。系统内部只引用角色别名（见 config/pux.config.yaml 的 roles）。
# 本机只有 Vertex AI 上的 Gemini：hydrogen≈flash，argon≈pro，carbon≈ultra。
# 新增厂商时只需在这里加 model_list 条目，并在 pux.config.yaml 里声明 family。
x-vertex: &vertex
  vertex_project: os.environ/VERTEX_PROJECT
  vertex_location: os.environ/VERTEX_LOCATION

model_list:
  - model_name: mind.fast
    litellm_params: { model: vertex_ai/gemini-4-hydrogen, <<: *vertex, reasoning_effort: low }
  - model_name: mind.slow
    litellm_params: { model: vertex_ai/gemini-4-argon, <<: *vertex }
  - model_name: operator.plan
    litellm_params: { model: vertex_ai/gemini-4-hydrogen, <<: *vertex, reasoning_effort: low }
  - model_name: operator.locate
    # Midscene 的 gemini family 会附带 google 扩展字段（Google OpenAI 兼容端点专用），经 LiteLLM 转 Vertex 时需丢弃
    litellm_params: { model: vertex_ai/gemini-4-hydrogen, <<: *vertex, reasoning_effort: low, additional_drop_params: ["google"] }
  - model_name: world.sim
    litellm_params: { model: vertex_ai/gemini-4-hydrogen, <<: *vertex, reasoning_effort: low }
  - model_name: judge.panel.0
    litellm_params: { model: vertex_ai/gemini-4-argon, <<: *vertex }
  - model_name: judge.panel.1
    litellm_params: { model: vertex_ai/gemini-4-carbon, <<: *vertex }
  - model_name: judge.panel.2
    litellm_params: { model: vertex_ai/gemini-4-hydrogen, <<: *vertex }
  - model_name: judge.meta
    litellm_params: { model: vertex_ai/gemini-4-carbon, <<: *vertex }
  - model_name: interview
    litellm_params: { model: vertex_ai/gemini-4-argon, <<: *vertex }
  - model_name: gen.persona
    litellm_params: { model: vertex_ai/gemini-4-argon, <<: *vertex }
  - model_name: product.induce
    litellm_params: { model: vertex_ai/gemini-4-argon, <<: *vertex }
  - model_name: demo.assistant
    litellm_params: { model: vertex_ai/gemini-4-hydrogen, <<: *vertex, reasoning_effort: low }
  - model_name: embed
    litellm_params: { model: vertex_ai/gemini-embedding-2, <<: *vertex }
  - model_name: image.gen
    litellm_params: { model: vertex_ai/gemini-3.1-flash-image, <<: *vertex }

litellm_settings:
  drop_params: true
  request_timeout: 180
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
